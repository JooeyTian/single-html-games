<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>合成大西瓜 · Fruit Merge</title>
<style>
  :root { --bg:#0a0d18; --panel:#141b30; --line:#273353; --text:#ecf1ff; --dim:#94a3c4; --accent:#7aa2ff; --gold:#ffd166; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
  #app { height:100vh; height:100dvh; display:flex; flex-direction:column; gap:8px; padding:8px; max-width:900px; margin:0 auto; }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:7px 12px; }
  .brand { font-size:16px; font-weight:900; white-space:nowrap; }
  .brand small { font-size:9px; color:var(--accent); letter-spacing:2px; margin-left:5px; }
  .stats { display:flex; align-items:center; gap:13px; margin-left:auto; }
  .stat { display:flex; flex-direction:column; min-width:42px; }
  .stat span { font-size:9px; color:var(--dim); letter-spacing:1px; }
  .stat b { font-size:17px; line-height:1.1; }
  #best b { color:var(--gold); }
  #chain b { color:#ff9a5b; }
  button { font-family:inherit; cursor:pointer; color:var(--text); background:#1e2a48; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12px; }
  button:active { transform:translateY(1px); }
  #mute { width:34px; }
  .main { flex:1; min-height:0; display:flex; gap:12px; justify-content:center; align-items:flex-start; }
  .board { position:relative; flex:none; display:flex; flex-direction:column; gap:6px; }
  canvas#cv {
    display:block; width:min(440px, calc(100vw - 20px), calc((100vh - 150px) * 0.6667));
    width:min(440px, calc(100vw - 20px), calc((100dvh - 150px) * 0.6667)); height:auto;
    border:1px solid var(--line); border-radius:12px; background:#0c1428; touch-action:none;
  }
  .nextbar { display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; color:var(--dim); }
  .nextbar b { font-size:22px; }
  .side { width:220px; align-self:stretch; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:12px; line-height:1.7; color:var(--dim); }
  .box h3 { margin:0 0 6px; font-size:13px; color:var(--text); }
  .box b { color:var(--gold); }
  .chainbox { text-align:center; }
  .chainbox strong { display:block; font-size:28px; color:#ff9a5b; }
  .over { position:absolute; inset:0 0 34px 0; display:grid; place-items:center; background:rgba(5,8,18,.8); backdrop-filter:blur(4px); border-radius:12px; z-index:3; }
  .over.hidden { display:none; }
  .card { text-align:center; padding:22px 28px; border:1px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:0 20px 60px rgba(0,0,0,.55); }
  .card h2 { margin:0 0 6px; font-size:24px; }
  .card p { margin:0 0 4px; color:var(--dim); font-size:12px; }
  .card .big { font-size:40px; font-weight:900; color:var(--gold); margin:6px 0; }
  .card button { margin-top:12px; font-size:14px; padding:9px 24px; border:0; font-weight:700; background:linear-gradient(135deg,#4a6cf0,#7a5cf0); }
  @media (max-width:700px){
    .side{ display:none; }
    .top { gap:8px; padding:6px 8px; }
    .brand { width:100%; font-size:15px; }
    .stats { width:100%; margin-left:0; justify-content:space-between; gap:5px; }
    button { min-height:40px; padding:8px 11px; }
    .nextbar { font-size:11px; }
  }
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html,body { touch-action:manipulation; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">🍉 合成大西瓜 <small>FRUIT MERGE</small></div>
    <div class="stats">
      <div class="stat"><span>分数</span><b id="score">0</b></div>
      <div class="stat" id="best"><span>最高</span><b>0</b></div>
      <div class="stat" id="chain"><span>连锁</span><b>0</b></div>
      <button id="mute">🔊</button>
      <button id="restart">重开</button>
    </div>
  </div>
  <div class="main">
    <div class="board">
      <canvas id="cv" width="440" height="660"></canvas>
      <div class="nextbar">下一个 <b id="nextIcon">🍇</b><span id="nextName">葡萄</span> · 移动鼠标 / 手指瞄准，点击投下</div>
      <div class="over hidden" id="over">
        <div class="card">
          <h2>堆到线啦 🍉</h2>
          <p>本局分数</p><div class="big" id="final">0</div>
          <p id="record"></p>
          <button id="again">再来一局</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="box"><h3>怎么玩</h3>相同水果碰到一起就会<b>合成更大的水果</b>。连锁合成会额外加分，连续合成越快倍率越高！水果堆过红线 2 秒就结束。</div>
      <div class="box chainbox"><h3>当前连锁</h3><strong id="chainBig">0</strong><span>快速连续合成 → 倍率飙升</span></div>
      <div class="box"><h3>合成树</h3>🍇 葡萄 → 🍒 樱桃 → 🍊 橘子 → 🍋 柠檬 → 🥝 猕猴桃 → 🍅 番茄 → 🍑 桃子 → 🍍 菠萝 → 🥥 椰子 → 🍈 哈密瓜 → 🍉 大西瓜</div>
      <div class="box"><h3>键盘</h3>← → 移动落点，空格投下，R 重开。</div>
    </div>
  </div>
</div>
<script>
(function(){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const W=440,H=660,DANGER=104;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  const R=[15,19,24,30,37,45,55,66,79,94,112];
  const FRUITS=[
    {n:'葡萄',   c:'#c4b5fd', d:'#6d4de0', e:'🍇'},
    {n:'樱桃',   c:'#ff8fa3', d:'#c9284a', e:'🍒'},
    {n:'橘子',   c:'#ffc268', d:'#e07b1a', e:'🍊'},
    {n:'柠檬',   c:'#ffe987', d:'#d6a80e', e:'🍋'},
    {n:'猕猴桃', c:'#bbf76b', d:'#5a8a11', e:'🥝'},
    {n:'番茄',   c:'#ff9276', d:'#cf3418', e:'🍅'},
    {n:'桃子',   c:'#ffc7d4', d:'#f2678a', e:'🍑'},
    {n:'菠萝',   c:'#ffe46b', d:'#d99a00', e:'🍍'},
    {n:'椰子',   c:'#e5c6a2', d:'#9c6b3f', e:'🥥'},
    {n:'哈密瓜', c:'#b6ee83', d:'#4f9e38', e:'🍈'},
    {n:'大西瓜', c:'#6ee7a0', d:'#168a3c', e:'🍉'}
  ];
  const PT=[1,3,6,10,15,21,28,36,45,55,66];
  const elScore=document.getElementById('score'), elBest=document.querySelector('#best b');
  const elChain=document.querySelector('#chain b'), elChainBig=document.getElementById('chainBig');
  const nextIcon=document.getElementById('nextIcon'), nextName=document.getElementById('nextName');
  const over=document.getElementById('over'), elFinal=document.getElementById('final'), elRecord=document.getElementById('record');
  const muteBtn=document.getElementById('mute');
  let balls=[],particles=[],floaters=[],nextTier=0,dropX=W/2,lastDrop=0,lastMerge=0;
  let score=0,chain=0,combo=0,best=+(localStorage.getItem('fruitMergeBest')||0),state='play',sound=true,actx=null;

  function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
  function beep(freq,dur,type,vol,slide){
    if(!sound||!actx) return;
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),actx.currentTime+dur);
    g.gain.setValueAtTime(vol||0.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }
  function randTier(){ const r=Math.random(); return r<0.30?0:r<0.55?1:r<0.74?2:r<0.89?3:4; }
  function sync(){ elScore.textContent=score; elBest.textContent=best; elChain.textContent=chain; elChainBig.textContent=chain; nextIcon.textContent=FRUITS[nextTier].e; nextName.textContent=FRUITS[nextTier].n; }
  function reset(){ balls=[];particles=[];floaters=[];score=0;chain=0;combo=0;nextTier=randTier();state='play';lastDrop=0;lastMerge=0;over.classList.add('hidden');sync(); }
  function burst(x,y,n,color){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=40+Math.random()*150; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:2+Math.random()*4}); } }
  function floater(text,x,y,color){ floaters.push({text,x,y,life:1,color}); }

  function drop(now){
    if(state!=='play'||now-lastDrop<360) return;
    ensureAudio();
    const r=R[nextTier], x=Math.max(r,Math.min(W-r,dropX));
    balls.push({x,y:r+8,vx:0,vy:0,r,tier:nextTier,dead:false,warn:0});
    nextTier=randTier(); lastDrop=now; sync();
    beep(240,0.06,'sine',0.07);
  }
  function step(dt,now){
    const sub=4,sdt=dt/sub;
    for(let s=0;s<sub;s++){
      for(const b of balls){
        b.vy+=1500*sdt; b.x+=b.vx*sdt; b.y+=b.vy*sdt;
        if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx)*0.35; }
        if(b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx)*0.35; }
        if(b.y>H-b.r){ b.y=H-b.r; b.vy=-Math.abs(b.vy)*0.22; b.vx*=0.86; }
        if(b.y<b.r){ b.y=b.r; if(b.vy<0) b.vy=0; }
      }
      const merges=[];
      for(let i=0;i<balls.length;i++){
        const a=balls[i]; if(a.dead) continue;
        for(let j=i+1;j<balls.length;j++){
          const b=balls[j]; if(b.dead) continue;
          const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy, rr=a.r+b.r;
          if(d2>=rr*rr||d2<0.0001) continue;
          const d=Math.sqrt(d2), nx=dx/d, ny=dy/d;
          if(a.tier===b.tier&&a.tier<R.length-1){ a.dead=b.dead=true; merges.push([a,b]); continue; }
          const ov=(rr-d)*0.5;
          a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
          const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
          if(rel<0){ const adj=rel*0.5; a.vx+=nx*adj; a.vy+=ny*adj; b.vx-=nx*adj; b.vy-=ny*adj; }
        }
      }
      if(merges.length){
        for(const [a,b] of merges){
          const t=a.tier+1;
          balls.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:(a.vx+b.vx)*0.4,vy:Math.min(a.vy,b.vy,-60)-40,r:R[t],tier:t,dead:false,warn:0});
          chain=(now-lastMerge<850)?chain+1:1; lastMerge=now;
          const pts=PT[t]+(chain>1?chain*2:0);
          score+=pts;
          floater('+'+pts,(a.x+b.x)/2,(a.y+b.y)/2-R[t],'#ffffff');
          burst((a.x+b.x)/2,(a.y+b.y)/2,8+t*2,FRUITS[t].c);
          beep(420+t*55,0.13,'sine',0.14,700+t*70);
          if(t===R.length-1) floater('🍉 大西瓜！',(a.x+b.x)/2,(a.y+b.y)/2-R[t]-24,'#4ade80');
        }
        balls=balls.filter(b=>!b.dead);
        sync();
      }
    }
    let danger=false;
    for(const b of balls){
      if(b.y-b.r<DANGER){ b.warn+=dt; danger=true; } else b.warn=0;
      if(b.warn>2.2){ end(now); return; }
    }
    if(danger&&Math.random()<dt*8) beep(160,0.05,'square',0.05);
  }
  function end(now){
    state='over'; beep(220,0.5,'sawtooth',0.16,60);
    if(score>best){ best=score; localStorage.setItem('fruitMergeBest',best); elRecord.textContent='🏆 新纪录！'; }
    else elRecord.textContent='最高分 '+best;
    elFinal.textContent=score; chain=0; sync();
    setTimeout(()=>over.classList.remove('hidden'),380);
  }
  function drawFruit(b){
    const f=FRUITS[b.tier];
    ctx.save();
    const g=ctx.createRadialGradient(b.x-b.r*0.35,b.y-b.r*0.4,b.r*0.08,b.x,b.y,b.r);
    g.addColorStop(0,f.c); g.addColorStop(1,f.d);
    ctx.fillStyle=g; ctx.shadowColor=f.d; ctx.shadowBlur=9;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath();
    ctx.ellipse(b.x-b.r*0.36,b.y-b.r*0.46,Math.max(1,b.r*0.18),Math.max(1,b.r*0.1),-0.5,0,Math.PI*2); ctx.fill();
    const er=Math.max(1.6,b.r*0.085);
    ctx.fillStyle='#252a40';
    ctx.beginPath(); ctx.arc(b.x-b.r*0.28,b.y-b.r*0.04,er,0,7); ctx.arc(b.x+b.r*0.28,b.y-b.r*0.04,er,0,7); ctx.fill();
    ctx.strokeStyle='#252a40'; ctx.lineWidth=Math.max(1.4,b.r*0.05); ctx.beginPath();
    ctx.arc(b.x,b.y+b.r*0.16,b.r*0.3,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    if(b.warn>0){
      ctx.strokeStyle='rgba(255,80,90,'+(0.4+0.4*Math.sin(performance.now()/80))+')';
      ctx.lineWidth=3; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+3,0,7); ctx.stroke();
    }
  }
  function render(now){
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#151f40'); bg.addColorStop(1,'#0c1428'); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const warn=balls.some(b=>b.warn>0);
    ctx.strokeStyle=warn?'rgba(255,80,90,'+(0.5+0.4*Math.sin(now/90))+')':'rgba(255,120,120,.35)';
    ctx.lineWidth=2; ctx.setLineDash([7,6]); ctx.beginPath(); ctx.moveTo(0,DANGER); ctx.lineTo(W,DANGER); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=warn?'rgba(255,80,90,.7)':'rgba(255,255,255,.35)'; ctx.font='11px system-ui'; ctx.textAlign='left'; ctx.fillText('危险线',8,DANGER-6);
    if(state==='play'){
      const r=R[nextTier], x=Math.max(r,Math.min(W-r,dropX));
      ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.setLineDash([5,7]); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(x,30); ctx.lineTo(x,H); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha=0.55; drawFruit({x,y:40,r,tier:nextTier,warn:0}); ctx.globalAlpha=1;
    }
    for(const b of balls) drawFruit(b);
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    for(const f of floaters){ ctx.globalAlpha=Math.max(0,f.life); ctx.fillStyle=f.color; ctx.font='900 18px system-ui'; ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.strokeText(f.text,f.x,f.y); ctx.fillText(f.text,f.x,f.y); }
    ctx.globalAlpha=1;
  }
  function update(dt,now){
    if(state==='play') step(dt,now);
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=380*dt; p.life-=dt*1.5; }
    particles=particles.filter(p=>p.life>0);
    for(const f of floaters){ f.y-=38*dt; f.life-=dt*1.15; }
    floaters=floaters.filter(f=>f.life>0);
  }
  function loop(t){ const dt=Math.min(0.033,(t-last)/1000||0); last=t; update(dt,t); render(t); requestAnimationFrame(loop); }
  let last=0;
  function pointerX(e){ const r=cv.getBoundingClientRect(); return (e.clientX-r.left)*W/r.width; }
  cv.addEventListener('pointermove',e=>{ dropX=pointerX(e); });
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); dropX=pointerX(e); drop(performance.now()); });
  window.addEventListener('keydown',e=>{
    if(e.code==='ArrowLeft'){ dropX=Math.max(0,dropX-22); e.preventDefault(); }
    if(e.code==='ArrowRight'){ dropX=Math.min(W,dropX+22); e.preventDefault(); }
    if(e.code==='Space'){ e.preventDefault(); drop(performance.now()); }
    if(e.key==='r'||e.key==='R') reset();
  });
  document.getElementById('restart').onclick=reset; document.getElementById('again').onclick=reset;
  muteBtn.onclick=()=>{ sound=!sound; muteBtn.textContent=sound?'🔊':'🔇'; if(sound){ensureAudio(); beep(600,.08,'sine',.1);} };
  reset(); requestAnimationFrame(loop);
})();
</script>
<!-- 应用模式：屏蔽浏览器原生交互（选中/拖拽/右键菜单/双击缩放） -->
<script>
(function(){
  var EDITABLE='input,textarea,select,[contenteditable]';
  ['selectstart','dragstart'].forEach(function(type){ document.addEventListener(type,function(e){ if(e.target&&e.target.closest&&e.target.closest(EDITABLE))return; e.preventDefault(); }); });
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  ['gesturestart','gesturechange','gestureend'].forEach(function(type){ document.addEventListener(type,function(e){ e.preventDefault(); },{passive:false}); });
  window.addEventListener('wheel',function(e){ if(e.ctrlKey||e.metaKey)e.preventDefault(); },{passive:false});
  window.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>=0)e.preventDefault(); });
})();
</script>
</body>
</html>
