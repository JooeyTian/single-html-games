<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>一拳 · 究极进化</title>
<style>
  :root {
    --panel: #14142c;
    --border: #2c2c55;
    --accent: #ff4655;
    --gold: #ffd166;
    --text: #eaeaf8;
    --dim: #8a8aae;
    --rare: #5fa8ff;
    --epic: #c05fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #05050c; color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none; overflow: hidden;
  }
  body { display: flex; justify-content: center; }

  #app {
    width: 1100px; max-width: 100vw; height: 100vh;
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px; overflow-y: auto;
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px;
  }
  .hud-item { display: flex; flex-direction: column; gap: 2px; min-width: 58px; }
  .hud-label { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .hud-value { font-size: 19px; font-weight: 800; line-height: 1.1; }
  #gold { color: var(--gold); }
  #monsterName { color: var(--accent); font-size: 16px; }
  #hpWrap {
    flex: 1; min-width: 160px; height: 16px;
    background: #1c1c34; border: 1px solid #34345c;
    border-radius: 8px; overflow: hidden;
  }
  #hpBar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff4655, #ff9a5b);
    transition: width .12s linear;
  }

  /* ---------- battlefield ---------- */
  #battlefield {
    position: relative; flex: 1; min-height: 230px;
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); background: #05050e;
    cursor: pointer;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #combo, #chainLabel {
    position: absolute; font-weight: 800; letter-spacing: 1px;
    pointer-events: none; text-shadow: 0 2px 8px #000;
  }
  #combo { top: 12px; left: 16px; font-size: 14px; color: var(--gold); }
  #chainLabel { top: 12px; right: 16px; font-size: 16px; color: #ff9a3d; }
  #skillBar {
    position: absolute; bottom: 8px; left: 12px; right: 12px;
    display: flex; flex-wrap: wrap; gap: 5px; pointer-events: none;
  }
  .skillChip {
    font-size: 10px; padding: 3px 7px; border-radius: 10px;
    background: rgba(20,20,45,.8); border: 1px solid var(--border);
  }
  .skillChip.rare { border-color: var(--rare); color: #bfe0ff; }
  .skillChip.epic { border-color: var(--epic); color: #e6c6ff; }

  /* ---------- controls ---------- */
  #controls { display: flex; gap: 10px; align-items: stretch; }
  #punchBtn {
    flex: 1; padding: 14px; font-size: 26px; font-weight: 900;
    letter-spacing: 8px; color: #fff; font-family: inherit;
    background: linear-gradient(180deg, #ff5563, #c22334);
    border: none; border-radius: 10px; cursor: pointer;
    box-shadow: 0 5px 0 #7a1220, 0 10px 24px rgba(255,70,85,.28);
    transition: transform .05s, box-shadow .05s, filter .1s;
  }
  #punchBtn:hover { filter: brightness(1.08); }
  #punchBtn:active { transform: translateY(5px); box-shadow: 0 0 0 #7a1220; }
  .hint {
    width: 120px; text-align: center; display: flex; align-items: center;
    justify-content: center; font-size: 11px; line-height: 1.5; color: var(--dim);
    border: 1px dashed var(--border); border-radius: 10px;
  }
  #soundCtrl {
    width: 190px; display: flex; align-items: center; gap: 7px; padding: 0 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    font-size: 11px; color: var(--dim);
  }
  #muteBtn {
    background: #23234a; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 11px;
  }
  #volume { flex: 1; accent-color: var(--accent); }

  /* ---------- shop ---------- */
  #shop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .upg {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; text-align: left;
    color: var(--text); cursor: pointer; font-family: inherit;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .upg:hover:not(:disabled) { border-color: var(--accent); background: #1c1c3c; }
  .upg:active:not(:disabled) { transform: scale(.97); }
  .upg:disabled { opacity: .45; cursor: not-allowed; }
  .upg-name { font-size: 12px; font-weight: 800; }
  .upg-lv { font-size: 10px; color: var(--dim); font-weight: 500; }
  .upg-effect { font-size: 10px; color: #9a9ac0; margin-top: 4px; min-height: 13px; }
  .upg-cost { font-size: 11px; color: var(--gold); margin-top: 4px; font-weight: 700; }

  /* ---------- stats ---------- */
  #stats {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px;
  }
  .stat { text-align: center; }
  .stat span { display: block; font-size: 9px; color: var(--dim); letter-spacing: .5px; }
  .stat b { display: block; font-size: 14px; color: var(--text); margin-top: 2px; }
  .stat.hi b { color: var(--gold); }

  /* ---------- prestige ---------- */
  #prestigeBar {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 14px;
  }
  #prestigeInfo { flex: 1; font-size: 11px; color: var(--dim); }
  #prestigeBtn {
    padding: 7px 18px; font-size: 13px; font-weight: 800; letter-spacing: 2px;
    color: #fff; background: linear-gradient(180deg, #7a4dff, #4a1fd0);
    border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
  }
  #prestigeBtn:disabled { background: #2c2c4a; color: #6a6a8a; cursor: not-allowed; }
  #prestigeBtn:not(:disabled):hover { filter: brightness(1.15); }

  /* ---------- card modal ---------- */
  #cardModal {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    background: rgba(5,5,12,.86); backdrop-filter: blur(5px);
  }
  #cardModal.show { display: flex; }
  #cardTitle { font-size: 24px; font-weight: 900; letter-spacing: 4px; color: var(--gold); }
  #cardSub { font-size: 12px; color: var(--dim); margin-top: -12px; }
  #cardRow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .card {
    width: 210px; min-height: 240px; padding: 14px; cursor: pointer;
    border: 2px solid #666; border-radius: 12px;
    background: linear-gradient(180deg, #1e1e40, #0e0e22);
    display: flex; flex-direction: column; gap: 8px;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-10px); box-shadow: 0 12px 32px rgba(0,0,0,.6); }
  .card.common { border-color: #777; }
  .card.rare { border-color: var(--rare); box-shadow: 0 0 18px rgba(95,168,255,.25); }
  .card.epic { border-color: var(--epic); box-shadow: 0 0 24px rgba(192,95,255,.35); }
  .card .rarity { font-size: 10px; letter-spacing: 2px; color: var(--dim); }
  .card.rare .rarity { color: #8fc8ff; }
  .card.epic .rarity { color: #d9a6ff; }
  .card .cname { font-size: 20px; font-weight: 900; }
  .card .clv { font-size: 11px; color: var(--gold); }
  .card .cdesc { font-size: 12px; line-height: 1.6; color: #bdbde0; flex: 1; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; top: 24px; left: 50%; transform: translate(-50%, -16px);
    background: #1c1c3c; border: 1px solid var(--accent);
    padding: 10px 22px; border-radius: 8px; font-size: 13px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: .25s; z-index: 200;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 780px) {
    #shop { grid-template-columns: repeat(2, 1fr); }
    #stats { grid-template-columns: repeat(4, 1fr); }
    .card { width: 160px; }
  }

  /* 应用模式：禁用文字选中、长按菜单、点击高亮与双击/双指缩放 */
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  html, body { touch-action: manipulation; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-item"><span class="hud-label">阶段</span><span class="hud-value" id="stage">1</span></div>
    <div class="hud-item"><span class="hud-label">目标</span><span class="hud-value" id="monsterName">史莱姆</span></div>
    <div id="hpWrap"><div id="hpBar"></div></div>
    <div class="hud-item"><span class="hud-label">金币</span><span class="hud-value" id="gold">0</span></div>
    <div class="hud-item"><span class="hud-label">每拳伤害</span><span class="hud-value" id="dps">1</span></div>
    <div class="hud-item"><span class="hud-label">理论秒伤</span><span class="hud-value" id="tdps">1</span></div>
    <div class="hud-item"><span class="hud-label">连击</span><span class="hud-value" id="comboHud">0</span></div>
    <div class="hud-item"><span class="hud-label">境界</span><span class="hud-value" id="realm">0</span></div>
  </div>

  <div id="battlefield">
    <canvas id="game"></canvas>
    <div id="combo"></div>
    <div id="chainLabel"></div>
    <div id="skillBar"></div>
  </div>

  <div id="controls">
    <button id="punchBtn">打</button>
    <div class="hint">点击怪物<br>或按空格键</div>
    <div id="soundCtrl">
      <button id="muteBtn">🔊</button>
      <span>音量</span><input id="volume" type="range" min="0" max="100" value="50">
    </div>
  </div>

  <div id="stats">
    <div class="stat hi"><span>实测秒伤</span><b id="stAdps">0</b></div>
    <div class="stat"><span>累计伤害</span><b id="stTotal">0</b></div>
    <div class="stat"><span>最高单拳</span><b id="stMax">0</b></div>
    <div class="stat"><span>连锁击杀</span><b id="stChain">0</b></div>
    <div class="stat"><span>总击杀</span><b id="stKills">0</b></div>
    <div class="stat"><span>暴击率</span><b id="stCrit">5%</b></div>
    <div class="stat"><span>暴击倍率</span><b id="stCritDmg">2.0x</b></div>
    <div class="stat"><span>技能数</span><b id="stSkills">0</b></div>
  </div>

  <div id="shop"></div>

  <div id="prestigeBar">
    <span id="prestigeInfo"></span>
    <button id="prestigeBtn" disabled>突破极限</button>
  </div>
</div>

<div id="cardModal">
  <div id="cardTitle">技能觉醒</div>
  <div id="cardSub">选择一张卡牌强化你的流派（已拥有的技能会持续升级）</div>
  <div id="cardRow"></div>
</div>
<div id="toast"></div>

<script>
"use strict";

const SAVE_KEY = "onePunchSave_v2";
const OLD_KEY = "onePunchSave_v1";

/* ---------- data ---------- */
const MONSTERS = [
  { name: "史莱姆",     color: "#5fe08a", mech: "none",  armor: 0    },
  { name: "哥布林",     color: "#a8e05f", mech: "dodge", armor: 0    },
  { name: "骷髅兵",     color: "#d8d8e8", mech: "none",  armor: 0.05 },
  { name: "蝙蝠群",     color: "#b46bd8", mech: "regen", armor: 0    },
  { name: "石甲虫",     color: "#c0a060", mech: "armor", armor: 0.28 },
  { name: "幽灵",       color: "#9fd8ff", mech: "phase", armor: 0    },
  { name: "吸血鬼",     color: "#e05f7f", mech: "regen", armor: 0.05 },
  { name: "分裂史莱姆", color: "#7fe0a8", mech: "split", armor: 0    },
  { name: "水晶巨像",   color: "#6fd0e0", mech: "shield",armor: 0.1  },
  { name: "狂暴狼人",   color: "#e08a4f", mech: "rage",  armor: 0    },
  { name: "巨龙",       color: "#ff5f5f", mech: "armor", armor: 0.18 },
  { name: "山岳巨人",   color: "#d0a060", mech: "armor", armor: 0.32 },
  { name: "星球",       color: "#5fa8ff", mech: "shield",armor: 0.12 },
  { name: "宇宙",       color: "#c05fff", mech: "rage",  armor: 0.1  },
];

const UPGRADES = [
  { id: "power",   name: "力量",     base: 10,  growth: 1.45,
    desc: () => "基础伤害 " + fmt(getBaseDamage()) },
  { id: "crit",    name: "暴击率",   base: 30,  growth: 1.60,
    desc: () => getCritChance() >= 0.85 - 1e-9 ? "已达上限 85%" : "暴击率 " + (getCritChance()*100).toFixed(0) + "%" },
  { id: "critDmg", name: "暴击伤害", base: 55,  growth: 1.60,
    desc: () => "暴击 " + getCritMult().toFixed(1) + " 倍" },
  { id: "combo",   name: "连击",     base: 140, growth: 1.75,
    desc: () => "每层 +" + (6*(1+0.1*state.comboLv)).toFixed(1) + "% · 上限 " + (20+3*state.comboLv) + " 层" },
  { id: "auto",    name: "自动出拳", base: 320, growth: 1.90,
    desc: () => state.autoLv + " 次/秒" },
  { id: "gold",    name: "金币加成", base: 90,  growth: 1.60,
    desc: () => "击杀金币 +" + (state.goldLv*15) + "%" },
  { id: "pierce",  name: "穿透连锁", base: 260, growth: 1.80,
    desc: () => "一拳最多命中 " + (1+state.pierceLv) + " 个目标" },
  { id: "execute", name: "处决",     base: 400, growth: 1.85,
    desc: () => "伤害达 " + (3-0.3*state.executeLv).toFixed(1) + " 倍血量即处决" },
];

const SKILLS = [
  { id:"burst", name:"爆裂拳", rarity:"rare", max:5,
    desc:l => "每拳 " + (20+10*l) + "% 概率爆炸，对周围怪物造成 " + (40+20*l) + "% 伤害" },
  { id:"thunder", name:"霹雷", rarity:"epic", max:5,
    desc:l => "每 " + Math.max(3,8-l) + " 拳落雷，对所有怪物造成 " + (60+30*l) + "% 伤害并麻痹" },
  { id:"steal", name:"妙手空空", rarity:"common", max:5,
    desc:l => "击杀时 " + (15*l) + "% 概率偷取额外 " + (50*l) + "% 金币" },
  { id:"arc", name:"连锁电弧", rarity:"rare", max:4,
    desc:l => "连锁击杀时向下一目标追加 " + (30*l) + "% 伤害" },
  { id:"critMark", name:"暴击印记", rarity:"epic", max:4,
    desc:l => "暴击后 " + (20*l) + "% 概率让下一拳必定暴击（突破 85% 上限）" },
  { id:"goldFist", name:"黄金拳", rarity:"common", max:5,
    desc:l => "击杀金币随当前连击层数提升，每层 +" + (2*l) + "%" },
  { id:"armorBreak", name:"碎甲", rarity:"rare", max:4,
    desc:l => "无视护甲与护盾，并追加 " + (5*l) + "% 真实伤害" },
  { id:"giantKiller", name:"巨人杀手", rarity:"common", max:5,
    desc:l => "对精英与 Boss 伤害 +" + (50*l) + "%" },
  { id:"ultimate", name:"终极一拳", rarity:"epic", max:5,
    desc:l => "每 " + Math.max(8,30-4*l) + " 拳蓄力，造成 " + (3+2*l) + " 倍伤害并穿透全部" },
  { id:"timeSand", name:"时之沙", rarity:"rare", max:4,
    desc:l => "连击衰减窗口 +" + (0.3*l) + " 秒，连击上限 +" + (3*l) + " 层" },
  { id:"autoSync", name:"自动同步", rarity:"common", max:4,
    desc:l => "自动出拳有 " + (30*l) + "% 概率叠加连击层数" },
  { id:"lucky", name:"幸运星", rarity:"epic", max:2,
    desc:l => "选卡时多 " + l + " 个选项，并提高稀有卡概率" },
];

const RARITY_TEXT = { common:"普通", rare:"稀有", epic:"史诗" };

function defaultState() {
  return {
    version: 2,
    stage: 1, runMaxStage: 1, gold: 0, realm: 0,
    powerLv:0, critLv:0, critDmgLv:0, comboLv:0,
    autoLv:0, goldLv:0, pierceLv:0, executeLv:0,
    skills: {},
    monsters: [],
    kills:0, chainKills:0, totalDamage:0, maxHit:0,
    killsSinceCard:0, punches:0,
    lastSeen: Date.now(),
  };
}

function loadGame() {
  let raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    try { return Object.assign(defaultState(), JSON.parse(raw)); } catch (e) {}
  }
  // migrate from v1
  try {
    const old = localStorage.getItem(OLD_KEY);
    if (old) {
      const o = JSON.parse(old);
      const s = defaultState();
      for (const k of ["stage","runMaxStage","gold","realm","powerLv","critLv","critDmgLv","comboLv","autoLv"]) {
        if (typeof o[k] === "number") s[k] = o[k];
      }
      return s;
    }
  } catch (e) {}
  return defaultState();
}

function saveGame() {
  state.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = loadGame();

/* ---------- formulas ---------- */
function prestigeMult() { return 1 + state.realm * 0.5; }
function monsterHpFor(stage) { return Math.max(1, Math.floor(10 * Math.pow(1.25, stage-1))); }
function goldFor(stage) { return Math.ceil(2 * Math.pow(1.32, stage-1)); }
function getBaseDamage() { return (1 + state.powerLv) * Math.pow(1.35, state.powerLv) * prestigeMult(); }
function getCritChance() { return Math.min(0.85, 0.05 + state.critLv*0.05); }
function getCritMult() { return 2 + state.critDmgLv*0.5; }
function getComboMult() { return 1 + comboStacks * 0.06 * (1 + 0.1*state.comboLv); }
function skillLv(id) { return state.skills[id] || 0; }
function upgradeCost(u) { return Math.ceil(u.base * Math.pow(u.growth, state[u.id+"Lv"])); }
function prestigeGain() { return Math.max(1, Math.floor(Math.pow(state.runMaxStage, 0.6))); }

function expectedPerPunch() {
  const cc = getCritChance(), cm = getCritMult();
  return getBaseDamage() * (1 + 20*0.06*(1+0.1*state.comboLv)) * (1 - cc + cc*cm);
}
function expectedDps() { return expectedPerPunch() * Math.max(1, state.autoLv); }

function fmt(n) {
  if (!isFinite(n)) return "∞";
  if (n < 1000) return Math.floor(n).toString();
  const units = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
  const i = Math.floor(Math.log10(n)/3);
  if (i >= units.length) return n.toExponential(2).replace("e+", "e");
  return (n/Math.pow(1000,i)).toFixed(2) + units[i];
}

/* ---------- audio ---------- */
let audioCtx = null, masterGain = null, muted = false, volume = 0.5;
let lastSound = 0, lastKillSound = 0;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = volume;
    masterGain.connect(audioCtx.destination);
  } catch (e) { audioCtx = null; }
}
function tone(freq, endFreq, dur, type, gain, delay) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime + (delay||0);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq), t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+0.03);
}
function noise(dur, gain, cutoff) {
  if (!audioCtx || muted) return;
  const len = Math.floor(audioCtx.sampleRate*dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cutoff||1400;
  const g = audioCtx.createGain(); g.gain.value=gain;

/* ---------- fx ---------- */
let texts = [], particles = [], bolts = [];
let hitT = 0, punchT = 0, shakeT = 0;
let pending = { amt:0, crit:false, exec:false, t:0 };
let comboStacks = 0, comboTimer = 0, nextCrit = false, punches = 0;

function spawnDamage(amount, crit, exec) {
  texts.push({
    x: W*0.46 + (Math.random()-0.5)*100,
    y: H*0.42 - 20,
    vy: -0.65 - Math.random()*0.35,

    kind: exec ? "exec" : crit ? "crit" : "normal",
  });
  if (texts.length > 14) texts.splice(0, texts.length-14);
}
function spawnNote(txt, color) {
  texts.push({ x:W*0.5 + (Math.random()-0.5)*70, y:H*0.36, vy:-0.9, life:1, txt, kind:"note", color:color||"#8fe0ff" });
  if (texts.length > 14) texts.splice(0, texts.length-14);
}
function spawnExplosion(color, big) {
  const n = big ? 70 : 38;
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*8;
    particles.push({ x:W*0.46, y:H*0.46, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:1, color, size:2+Math.random()*6 });
  }
  if (particles.length > 400) particles.splice(0, particles.length-400);
}
function spawnLightning() {
  bolts.push({ life:1, pts:(()=>{ const p=[]; for(let i=0;i<8;i++) p.push({x:Math.random()*W,y:i/8*H*0.8}); return p; })() });
}
function addPendingDamage(amt, crit, exec) {
  pending.amt += amt;
  pending.crit = pending.crit || crit;
  pending.exec = pending.exec || exec;
  const now = performance.now();
  if (now-pending.t >= 85 || pending.amt >= monsterHpFor(state.stage)*80) flushPending();
}
function flushPending() {
  if (pending.amt <= 0) return;
  const amt = pending.amt;
  spawnDamage(amt, pending.crit, pending.exec);
  state.maxHit = Math.max(state.maxHit, amt);
  punchT = 1; hitT = 1;
  shakeT = Math.min(1, 0.3 + Math.log10(1+amt)*0.1);
  pending = { amt:0, crit:false, exec:false, t:performance.now() };
}

function updateFx(dt) {
  const now = performance.now();
  if (pending.amt>0 && now-pending.t>=85) flushPending();
  for (const t of texts) { t.y += t.vy*dt/16; t.life -= dt/900; }
  texts = texts.filter(t=>t.life>0);
  for (const p of particles) {
    p.x += p.vx*dt/16; p.y += p.vy*dt/16; p.vy += 0.18*dt/16; p.life -= dt/720;
  }
  particles = particles.filter(p=>p.life>0);
  for (const b of bolts) b.life -= dt/260;
  bolts = bolts.filter(b=>b.life>0);
  if (hitT>0) hitT = Math.max(0, hitT-dt/140);
  if (punchT>0) punchT = Math.max(0, punchT-dt/190);
  if (shakeT>0) shakeT = Math.max(0, shakeT-dt/200);
  for (const m of state.monsters) if (m.flash>0) m.flash = Math.max(0, m.flash-dt/150);
  if (comboTimer>0) {
    comboTimer -= dt;
    if (comboTimer<=0) comboStacks = 0;
  }
}

function drawFx() {
  for (const b of bolts) {
    ctx.globalAlpha = b.life;
    ctx.strokeStyle = "#bfe6ff"; ctx.lineWidth = 3;
    ctx.shadowColor = "#7fd0ff"; ctx.shadowBlur = 14;
    ctx.beginPath();
    for (let i=0;i<b.pts.length;i++) {
      const p=b.pts[i];
      if(i===0) ctx.moveTo(p.x,0); else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke(); ctx.shadowBlur = 0;
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.textAlign = "center";
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life*2.2);
    const sz = (t.kind==="crit"||t.kind==="exec" ? 36 : t.kind==="note" ? 20 : 24) * (0.7+0.3*t.life);
    ctx.font = "900 " + sz + "px 'Segoe UI', sans-serif";
    ctx.lineWidth = 5; ctx.strokeStyle = "#05050c";
    ctx.strokeText(t.txt, t.x, t.y);
    ctx.fillStyle = t.kind==="crit" ? "#ff4655" : t.kind==="exec" ? "#ffd166" : (t.color||"#ffffff");
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

    ctx.fillStyle = "#cdd6ff"; ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(120,100,255,.10)"; ctx.lineWidth = 1;
  const hy = H*0.64;
  for (let i=0;i<=12;i++) {
    const y = hy+Math.pow(i/12,1.6)*(H-hy);

  for (let i=-12;i<=12;i++) {

}

  ctx.fillStyle="#ff8a3d"; ctx.shadowBlur=12;
  ctx.fillRect(-s*0.32,-s*0.25,s*0.18,s*0.08); ctx.fillRect(s*0.14,-s*0.25,s*0.18,s*0.08);
  ctx.shadowBlur=0; ctx.restore();
}
function drawPlanet(cx,cy,s) {
  ctx.save(); ctx.translate(cx,cy);
  ctx.strokeStyle="rgba(150,200,255,.65)"; ctx.lineWidth=8;
  ctx.beginPath(); ctx.ellipse(0,0,s*1.25,s*0.38,-0.35,Math.PI,Math.PI*2); ctx.stroke();
  const g=ctx.createRadialGradient(-s*0.3,-s*0.3,s*0.1,0,0,s);
  g.addColorStop(0,"#8fd0ff"); g.addColorStop(0.6,"#3a7fd5"); g.addColorStop(1,"#16306e");
  ctx.fillStyle=g; ctx.shadowColor="#5fa8ff"; ctx.shadowBlur=28;
  ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle="rgba(120,220,180,.5)";
  ctx.beginPath(); ctx.ellipse(-s*0.3,-s*0.1,s*0.28,s*0.14,0.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.35,s*0.3,s*0.22,s*0.12,-0.3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="rgba(190,220,255,.85)"; ctx.lineWidth=8;
  ctx.beginPath(); ctx.ellipse(0,0,s*1.25,s*0.38,-0.35,0,Math.PI); ctx.stroke();
  ctx.restore();
}
function drawCosmos(cx,cy,s) {
  ctx.save(); ctx.translate(cx,cy);
  ctx.rotate(performance.now()/2000*0.15);
  ctx.shadowColor="#c05fff"; ctx.shadowBlur=24;
  for(let arm=0;arm<3;arm++){
    for(let i=0;i<48;i++){
      const a=arm*Math.PI*2/3+i*0.09, r=s*0.08+i*s*0.021;
      ctx.fillStyle=i%4===0?"#ffffff":(arm===0?"#c05fff":arm===1?"#5f8fff":"#ff7fd0");
      ctx.globalAlpha=1-i/55;
      ctx.beginPath(); ctx.arc(Math.cos(a)*r,Math.sin(a)*r*0.7,Math.max(0.6,3-i*0.04),0,Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  const g=ctx.createRadialGradient(0,0,0,0,0,s*0.3);
  g.addColorStop(0,"#fff"); g.addColorStop(0.3,"#ffd6ff"); g.addColorStop(1,"rgba(192,95,255,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,s*0.3,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
}
const MONSTER_DRAWERS = [drawSlime,drawGoblin,drawSkeleton,drawBat,drawBeetle,drawGhost,drawVampire,drawSlime,drawCrystal,drawWolf,drawDragon,drawGiant,drawPlanet,drawCosmos];

function drawFist(px,py,scale) {
  ctx.save(); ctx.translate(px,py); ctx.scale(scale,scale); ctx.rotate(-0.25);
  ctx.shadowColor="#ff9a3d"; ctx.shadowBlur=22;
  const g=ctx.createLinearGradient(0,-40,0,60);
  g.addColorStop(0,"#ffb347"); g.addColorStop(1,"#8a3b0c");
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(-26,-10,52,86,14); ctx.fill();
  ctx.fillStyle="#ffcd6b";
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(-22+i*15,-22,11,0,Math.PI*2); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(-30,6,12,18,-0.4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle="#6b2a08"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect(-26,-10,52,86,14); ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.setTransform(1,0,0,1,0,0);
  drawBackground();
  ctx.save();
  if (shakeT>0) ctx.translate((Math.random()-0.5)*shakeT*11,(Math.random()-0.5)*shakeT*11);

  const slots = [
    { x:W*0.46, s:1,    y:H*0.46 },
    { x:W*0.76, s:0.66, y:H*0.50 },
    { x:W*0.92, s:0.46, y:H*0.54 },
  ];
  const base = Math.min(118,H*0.20);
  for (let i=Math.min(2,state.monsters.length-1);i>=0;i--) {
    const m = state.monsters[i], slot = slots[i];
    const s = base*slot.s;
    ctx.save();
    ctx.globalAlpha = i===0 ? 1 : 0.78;
    if (m.spawnAnim>0) {
      const sc = 0.4+0.6*(1-m.spawnAnim);
      ctx.translate(slot.x,slot.y); ctx.scale(sc,sc); ctx.translate(-slot.x,-slot.y);
      m.spawnAnim = Math.max(0, m.spawnAnim-0.03);
    }
    if (m.tier!=="normal") {
      ctx.shadowColor = m.tier==="boss" ? "#ff4655" : "#ffd166";
      ctx.shadowBlur = m.tier==="boss" ? 34 : 22;
    }
    MONSTER_DRAWERS[m.type](slot.x,slot.y,s);
    ctx.shadowBlur = 0;
    if (m.shield>0) {
      ctx.strokeStyle="rgba(150,220,255,.85)"; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(slot.x,slot.y,s*1.02,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,m.shield/m.maxHp)); ctx.stroke();
    }
    if (m.flash>0) {
      ctx.globalAlpha = m.flash*0.5; ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(slot.x,slot.y,s*0.78,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = i===0 ? 1 : 0.78;
    }
    // hp bar
    const bw = s*1.5, bx = slot.x-bw/2, by = slot.y+s*0.95;
    ctx.fillStyle="rgba(10,10,25,.85)"; ctx.fillRect(bx,by,bw,6);
    ctx.fillStyle=m.tier==="boss"?"#ff4655":m.tier==="elite"?"#ffd166":"#ff7a85";
    ctx.fillRect(bx,by,bw*Math.max(0,m.hp/m.maxHp),6);
    ctx.restore();
  }

  const p = 1-punchT;
  const thrust = punchT>0 ? Math.sin(p*Math.PI) : 0;
  drawFist(W*0.84-W*0.34*thrust, H*0.82-H*0.2*thrust, 1+0.3*thrust);
  drawFx();
  ctx.restore();
}

/* ---------- monsters & combat ---------- */
function tierFor(stage) {
  if (stage%10===0) return "boss";
  if (stage%5===0) return "elite";
  return "normal";
}
function makeMonster(stage, tier, type) {
  tier = tier || tierFor(stage);
  const t = type===undefined ? (stage-1)%MONSTERS.length : type;
  const def = MONSTERS[t];
  const mult = tier==="boss"?5 : tier==="elite"?2.2 : tier==="mini"?0.3 : 1;
  const hp = Math.max(1, Math.floor(monsterHpFor(stage)*mult));
  const m = {
    stage, tier, type:t, maxHp:hp, hp,
    shield:0, armor:def.armor||0, mech:def.mech,
    color:def.color, name:def.name, flash:0, spawnAnim:1,
    noAdvance:tier==="mini", isSplit:tier==="mini",
  };
  if (def.mech==="shield") m.shield = hp*(0.25+0.01*(stage%20));
  return m;
}
function refillQueue() {
  let guard = 0;
  while (state.monsters.length<3 && guard++<20) {
    const nextStage = state.monsters.length ? state.monsters[state.monsters.length-1].stage+1 : state.stage;
    state.monsters.push(makeMonster(nextStage));
  }
}
function addCombo() {
  const maxStacks = 20+3*skillLv("timeSand");
  comboStacks = Math.min(maxStacks, comboStacks+1);
  comboTimer = 800+300*skillLv("timeSand");
}
function damageMonster(m, raw, opts) {
  if (!opts.ultimate && !opts.thunder && !opts.execute) {
    if (m.mech==="dodge" && Math.random()<0.08) { spawnNote("闪避","#bfe0ff"); return {dealt:0,killed:false,leftover:0}; }
    if (m.mech==="phase" && Math.random()<0.25) { spawnNote("虚化","#bfe0ff"); return {dealt:0,killed:false,leftover:0}; }
  }
  let dmg = raw;
  const ab = skillLv("armorBreak");
  if (m.armor && ab===0) dmg *= (1-m.armor);
  let absorbed = 0;
  if (m.shield>0 && ab===0) {
    absorbed = Math.min(m.shield,dmg);
    m.shield -= absorbed; dmg -= absorbed;
  }
  const trueDmg = raw*0.05*ab;
  const hpDmg = dmg+trueDmg;
  m.hp -= hpDmg; m.flash = 1;
  const dealt = absorbed+hpDmg;
  state.totalDamage += dealt;
  damageLog.push({t:performance.now(), amt:dealt});
  let killed=false, leftover=0;
  if (m.hp<=0) { leftover=-m.hp; killed=true; }
  if (killed) killMonster(m);
  return {dealt, killed, leftover};
}
function killMonster(m) {
  const idx = state.monsters.indexOf(m);
  if (idx>=0) state.monsters.splice(idx,1);
  const tierGold = m.tier==="boss"?12 : m.tier==="elite"?4 : 1;
  let gain = goldFor(m.stage)*tierGold*(1+0.15*state.goldLv);
  if (skillLv("goldFist")>0) gain *= 1+comboStacks*0.02*skillLv("goldFist");
  if (skillLv("steal")>0 && Math.random()<0.15*skillLv("steal")) {
    gain *= 1+0.5*skillLv("steal");
    spawnNote("偷钱 +"+fmt(gain), "#ffd166");
  }
  state.gold += gain;
  state.kills++;
  state.runMaxStage = Math.max(state.runMaxStage, m.stage);
  spawnExplosion(m.color, m.tier!=="normal");
  playSound("kill");
  if (m.mech==="split" && !m.isSplit) {
    const minis = [];
    for (let i=0;i<2;i++) {
      const mini = makeMonster(m.stage, "mini", m.type);
      minis.push(mini);
    }
    state.monsters.unshift(...minis);
    spawnNote("分裂!", "#7fe0a8");
  }
  if (!m.noAdvance) {
    const maxStage = state.monsters.reduce((a,b)=>Math.max(a,b.stage), 0);
    state.monsters.push(makeMonster(maxStage+1));
  }
  if (m.tier==="boss" || m.tier==="elite" || state.killsSinceCard>=12) {
    state.killsSinceCard = 0;
    pendingCards++;
  }
  refillQueue();
}
function applyPunchDamage(raw, opts) {
  let remaining = raw, hits = 0, extraKills = 0;
  const maxTargets = Math.min(9, 1+state.pierceLv+(opts.ultimate?5:0));
  while (remaining>0 && hits<maxTargets && state.monsters.length) {
    const m = state.monsters[0];
    const before = state.kills;
    const res = damageMonster(m, remaining, Object.assign({},opts,{chainIndex:hits}));
    hits++;
    if (state.kills>before) extraKills++;
    if (skillLv("arc")>0 && res.killed && state.monsters.length) {
      const extra = remaining*0.3*skillLv("arc");
      damageMonster(state.monsters[0], extra, {source:"arc"});
    }
    remaining = res.killed ? res.leftover*(0.75+0.05*state.pierceLv) : 0;
  }
  if (extraKills>1) {
    state.chainKills += extraKills-1;
    document.getElementById("chainLabel").textContent = "连锁 ×"+extraKills;
    clearTimeout(applyPunchDamage._t);
    applyPunchDamage._t = setTimeout(()=>{ document.getElementById("chainLabel").textContent=""; }, 900);
  }
  return hits;
}

const damageLog = [];
function getActualDps() {
  const now = performance.now();
  while (damageLog.length && now-damageLog[0].t>5000) damageLog.shift();
  let sum = 0;
  for (const d of damageLog) sum += d.amt;
  return sum/5;
}

function attack(isAuto) {
  if (paused || !state.monsters.length) return;
  punches++;
  if (isAuto) {
    const sync = Math.min(1, 0.3*skillLv("autoSync"));
    if (Math.random()<sync) addCombo();
  } else addCombo();

  const front = state.monsters[0];
  let crit = nextCrit || Math.random()<getCritChance();
  if (nextCrit) nextCrit = false;
  let raw = getBaseDamage()*getComboMult();
  if (crit) raw *= getCritMult();
  if (front.tier!=="normal") raw *= 1+0.5*skillLv("giantKiller");

  const ultEvery = Math.max(8, 30-4*skillLv("ultimate"));
  const ultimate = skillLv("ultimate")>0 && punches%ultEvery===0;
  if (ultimate) raw *= 3+2*skillLv("ultimate");

  if (crit && skillLv("critMark")>0 && Math.random()<0.2*skillLv("critMark")) nextCrit = true;

  const execThreshold = 3-0.3*skillLv("execute");
  const execute = front.tier!=="boss" && raw>=front.maxHp*execThreshold;
  if (execute) front.hp = Math.min(front.hp, 1);

  const opts = { crit, ultimate, execute, source:"punch" };
  applyPunchDamage(raw, opts);
  addPendingDamage(raw, crit, execute);
  playSound(crit?"crit":"punch");

  const bl = skillLv("burst");
  if (bl>0 && Math.random()<0.2+0.1*bl) {
    const bd = raw*(0.4+0.2*bl);
    for (const m of state.monsters.slice(1)) damageMonster(m, bd, {source:"burst"});
    spawnExplosion("#ff9a3d", false);
  }
  const tl = skillLv("thunder");
  if (tl>0 && punches%Math.max(3,8-tl)===0) {
    const td = raw*(0.6+0.3*tl);
    for (const m of state.monsters.slice()) damageMonster(m, td, {source:"thunder", thunder:true});
    spawnLightning(); playSound("thunder");
  }
}

/* ---------- cards ---------- */
let pendingCards = 0, paused = false;
function shuffle(a) {
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function drawCards() {
  const n = 3+skillLv("lucky");
  const upgrades = [], news = [];
  for (const s of SKILLS) {
    const lv = skillLv(s.id);
    if (lv>0 && lv<s.max) upgrades.push({s, upgrade:true, lv});
    else if (lv===0) news.push({s, upgrade:false, lv:0});
  }
  const chosen = [];
  if (upgrades.length) chosen.push(upgrades.splice(Math.floor(Math.random()*upgrades.length),1)[0]);
  const pool = shuffle(upgrades.concat(news));
  for (const c of pool) { if (chosen.length>=n) break; chosen.push(c); }
  while (chosen.length<n) {
    chosen.push({ gold:true, amt:Math.ceil(60*Math.pow(1.3,state.stage)) });
  }
  return shuffle(chosen).map(c => {
    if (c.gold) return { gold:true, amt:c.amt, rarity:"common", name:"金币袋",
      label:"+ "+fmt(c.amt)+" 金", desc:"直接的金币奖励，可用于强化固定属性。" };
    let rarity = c.s.rarity;
    if (rarity==="common" && Math.random()<0.3*skillLv("lucky")) rarity="rare";
    return { id:c.s.id, rarity, name:c.s.name,
      label: c.upgrade ? "Lv."+c.lv+" → Lv."+(c.lv+1) : "新技能",
      desc: c.s.desc(c.upgrade?c.lv+1:1) };
  });
}
function showCardModal() {
  const cards = drawCards();
  const row = document.getElementById("cardRow");
  row.innerHTML = "";
  cards.forEach((c,i) => {
    const el = document.createElement("div");
    el.className = "card "+c.rarity;
    el.innerHTML =
      '<div class="rarity">'+RARITY_TEXT[c.rarity]+'</div>'+
      '<div class="cname">'+c.name+'</div>'+
      '<div class="clv">'+c.label+'</div>'+
      '<div class="cdesc">'+c.desc+'</div>';
    el.addEventListener("click", ()=>chooseCard(c));
    row.appendChild(el);
  });
  document.getElementById("cardModal").classList.add("show");
  paused = true;
  playSound("card");
}
function chooseCard(c) {
  if (c.gold) state.gold += c.amt;
  else state.skills[c.id] = (state.skills[c.id]||0)+1;
  document.getElementById("cardModal").classList.remove("show");
  paused = false;
  playSound("upgrade");
  render(); saveGame();
}

/* ---------- shop & actions ---------- */
function buy(u) {
  if (u.id==="crit" && getCritChance()>=0.85-1e-9) return;
  const cost = upgradeCost(u);
  if (state.gold<cost) return;
  state.gold -= cost;
  state[u.id+"Lv"]++;
  playSound("upgrade");
  render(); saveGame();
}
function doPrestige() {
  if (state.runMaxStage<15) return;
  const gain = prestigeGain();
  state.realm += gain;
  state.stage = 1; state.runMaxStage = 1; state.gold = 0;
  for (const u of UPGRADES) state[u.id+"Lv"] = 0;
  state.skills = {};
  state.killsSinceCard = 0; state.punches = 0;
  comboStacks = 0; comboTimer = 0; nextCrit = false;
  state.monsters = []; refillQueue();
  pendingCards = 0;
  playSound("prestige");
  toast("突破成功！境界 +"+gain+" · 新倍率 x"+prestigeMult().toFixed(1)+" · 技能已重置");
  render(); saveGame();
}

function renderShop() {

function renderSkillBar() {

  const owned = SKILLS.filter(s=>skillLv(s.id)>0);
  bar.innerHTML = owned.length
    ? owned.map(s=>'<span class="skillChip '+s.rarity+'">'+s.name+' Lv.'+skillLv(s.id)+'</span>').join("")

}
function renderPrestige() {

      " · 当前最高阶段 "+state.runMaxStage+"（会重置固定升级与技能）";
  } else {
    info.textContent = "突破需本轮达到阶段 15（当前最高 "+state.runMaxStage+"）· 每 5 阶段精英 / 每 10 阶段 Boss / 每 12 击杀触发技能卡";

function render() {
  renderHud(); renderShop(); renderSkillBar(); renderPrestige();
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._timer);
  el._timer = setTimeout(()=>el.classList.remove("show"), 2800);
}

/* ---------- offline ---------- */
function applyOffline() {
  const now = Date.now();
  const away = Math.min((now-state.lastSeen)/1000, 3600);
  if (away>10 && state.autoLv>0) {
    const dps = expectedDps()*0.5;
    const gps = dps/monsterHpFor(state.stage)*goldFor(state.stage);
    const earned = Math.floor(gps*away);
    if (earned>0) {
      state.gold += earned;
      setTimeout(()=>toast("离线收益 +"+fmt(earned)+" 金"), 400);
    }
  }
  state.lastSeen = now;
}

/* ---------- main loop ---------- */
let lastTs = performance.now(), autoAcc = 0, hudAcc = 0;
function loop(ts) {
  const dt = Math.min(50, ts-lastTs);
  lastTs = ts;
  if (!paused) {
    if (state.autoLv>0) {
      const interval = 1000/state.autoLv;
      autoAcc += dt;
      let n=0;
      while (autoAcc>=interval && n<60) { attack(true); autoAcc-=interval; n++; }
      if (n>=60) autoAcc = 0;
    } else autoAcc = 0;

    // regen / rage
    for (const m of state.monsters) {
      if (m.mech==="regen") m.hp = Math.min(m.maxHp, m.hp+m.maxHp*0.012*dt/1000);
      if (m.mech==="rage") m.hp = Math.min(m.maxHp, m.hp+m.maxHp*0.02*dt/1000);
    }
    updateFx(dt);
    if (pendingCards>0) { pendingCards--; showCardModal(); }
    hudAcc += dt;
    if (hudAcc>180) { hudAcc=0; renderHud(); }
  }
  draw();
  requestAnimationFrame(loop);
}

/* ---------- events ---------- */
document.getElementById("punchBtn").addEventListener("click", ()=>{ initAudio(); attack(false); });
document.getElementById("battlefield").addEventListener("click", ()=>{ initAudio(); attack(false); });
document.getElementById("prestigeBtn").addEventListener("click", doPrestige);
document.getElementById("muteBtn").addEventListener("click", e=>{
  muted = !muted;
  e.currentTarget.textContent = muted ? "🔇" : "🔊";
});
document.getElementById("volume").addEventListener("input", e=>{
  volume = e.target.value/100;
  if (masterGain) masterGain.gain.value = volume;
});
document.addEventListener("keydown", e=>{
  if (e.code==="Space") { e.preventDefault(); initAudio(); attack(false); }
});
document.addEventListener("pointerdown", initAudio, {once:true});
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) saveGame(); });
window.addEventListener("beforeunload", saveGame);

/* ---------- init ---------- */
applyOffline();
if (!state.monsters.length) refillQueue();
resizeCanvas();
render();
saveGame();
requestAnimationFrame(loop);
setInterval(saveGame, 5000);
</script>
<!-- 应用模式：屏蔽浏览器原生交互（选中/拖拽/右键菜单/双击缩放） -->
<script>
(function () {
  var EDITABLE = 'input,textarea,select,[contenteditable]';
  ['selectstart', 'dragstart'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (e.target && e.target.closest && e.target.closest(EDITABLE)) return;
      e.preventDefault();
    });
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });
  window.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && ['+','-','=','0'].indexOf(e.key) >= 0) e.preventDefault();
  });
})();
</script>
