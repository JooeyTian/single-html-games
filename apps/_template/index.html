<!doctype html>
<!--
  新应用模板。
  用法：复制整个 _template 文件夹并改名，或修改其中的内容。
  约定：HTML / CSS / JS 都写在这一个文件里；如需拆分成多个文件，资源只放在本应用文件夹内。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>应用名称</title>
  <style>
    /* 样式写在这里，不引用外部 CSS */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .app { text-align: center; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0; color: #94a3b8; }

  /* 应用模式：禁用文字选中、长按菜单、点击高亮与双击/双指缩放 */
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  html, body { touch-action: manipulation; }
  </style>
</head>
<body>
  <main class="app">
    <h1>应用名称</h1>
    <p>从这里开始写你的游戏或工具 🎉</p>
    <!-- 游戏画布、工具界面等写在 <main> 里 -->
  </main>

  <script>
    // 脚本写在这里，不引用外部 JS
    // 如果是游戏，可以用下面的循环骨架：
    // function update(t) { /* 逻辑 */ requestAnimationFrame(update); }
    // requestAnimationFrame(update);
  </script>
<!-- 应用模式：屏蔽浏览器原生交互（选中/拖拽/右键菜单/双击缩放） -->
<script>
(function () {
  var EDITABLE = 'input,textarea,select,[contenteditable]';
  ['selectstart', 'dragstart'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (e.target && e.target.closest && e.target.closest(EDITABLE)) return;
      e.preventDefault();
    });
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });
  window.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && ['+','-','=','0'].indexOf(e.key) >= 0) e.preventDefault();
  });
})();
</script>
</body>
</html>
