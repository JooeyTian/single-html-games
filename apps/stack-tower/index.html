<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>叠叠塔 · Stack Tower</title>
<style>
  :root { --bg:#070b18; --panel:#111a30; --line:#243154; --text:#e8eeff; --dim:#90a0c4; --accent:#7aa2ff; --gold:#ffd166; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
  #app { height:100%; display:flex; flex-direction:column; gap:8px; padding:10px; max-width:760px; margin:0 auto; }
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px; }
  .brand { font-size:18px; font-weight:900; letter-spacing:1px; }
  .brand small { font-size:9px; color:var(--accent); letter-spacing:2px; margin-left:6px; }
  .stats { display:flex; align-items:center; gap:14px; margin-left:auto; }
  .stat { display:flex; flex-direction:column; min-width:46px; }
  .stat span { font-size:9px; color:var(--dim); letter-spacing:1px; }
  .stat b { font-size:18px; line-height:1.1; }
  #best b { color:var(--gold); }
  #combo b { color:#ff9a5b; }
  button { font-family:inherit; cursor:pointer; color:var(--text); background:#1b2745; border:1px solid var(--line); border-radius:8px; padding:7px 11px; font-size:12px; }
  button:active { transform:translateY(1px); }
  #mute { width:36px; }
  .stage { position:relative; flex:1; min-height:260px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:linear-gradient(180deg,#0d1630,#070b18); }
  canvas { display:block; width:100%; height:100%; }
  .hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:11px; color:var(--dim); pointer-events:none; }
  .over { position:absolute; inset:0; display:grid; place-items:center; background:rgba(5,8,18,.78); backdrop-filter:blur(4px); z-index:3; }
  .over.hidden { display:none; }
  .card { text-align:center; padding:26px 34px; border:1px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .card h2 { margin:0 0 8px; font-size:28px; }
  .card p { margin:0 0 6px; color:var(--dim); font-size:13px; }
  .card .big { font-size:44px; font-weight:900; color:var(--gold); margin:8px 0; }
  .card button { margin-top:14px; font-size:14px; padding:10px 26px; background:linear-gradient(135deg,#4a6cf0,#7a5cf0); border:0; font-weight:700; }
  @media (max-width:560px){
    #app { padding:6px; gap:6px; }
    .top { gap:8px; padding:6px 9px; }
    .brand { width:100%; font-size:15px; }
    .stats { width:100%; margin-left:0; justify-content:space-between; gap:5px; }
    button { min-height:40px; padding:8px 11px; }
    .hint { font-size:10px; }
    .card { padding:20px 22px; }
  }
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html,body { touch-action:manipulation; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">🧱 叠叠塔 <small>STACK TOWER</small></div>
    <div class="stats">
      <div class="stat"><span>分数</span><b id="score">0</b></div>
      <div class="stat" id="best"><span>最高</span><b>0</b></div>
      <div class="stat" id="combo"><span>连击</span><b>0</b></div>
      <button id="mute" title="声音">🔊</button>
      <button id="restart">重开</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint">点击屏幕 / 空格 落下 · 精准对齐触发 PERFECT 连击</div>
    <div class="over hidden" id="over">
      <div class="card">
        <h2>塔倒了 💥</h2>
        <p>本局分数</p><div class="big" id="final">0</div>
        <p id="record"></p>
        <button id="again">再来一次</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const stage=document.getElementById('stage');
  const elScore=document.getElementById('score'), elBest=document.querySelector('#best b'), elCombo=document.querySelector('#combo b');
  const over=document.getElementById('over'), elFinal=document.getElementById('final'), elRecord=document.getElementById('record');
  const muteBtn=document.getElementById('mute');
  const BH=24;
  let W=400,H=500,groundY=0;
  let blocks=[], moving=null, dir=1, speed=210, spawnLeft=true;
  let score=0,combo=0,best=+(localStorage.getItem('stackTowerBest')||0);
  let camY=0,shake=0,particles=[],floaters=[],state='play',last=0,sound=true,actx=null;

  function ensureAudio(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx&&actx.state==='suspended') actx.resume();
  }
  function beep(freq,dur,type,vol,slide){
    if(!sound||!actx) return;
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),actx.currentTime+dur);
    g.gain.setValueAtTime(vol||0.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }
  function resize(){
    const r=stage.getBoundingClientRect();
    const dpr=Math.min(2,window.devicePixelRatio||1);
    W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); groundY=H-46;
    camY=Math.max(0,blocks.length*BH-(groundY-130));
  }
  function movingW(){ return blocks.length?blocks[blocks.length-1].w:140; }
  function spawn(){ moving={x:spawnLeft?movingW()/2+16:W-movingW()/2-16,w:movingW()}; dir=spawnLeft?1:-1; spawnLeft=!spawnLeft; }
  function reset(){ blocks=[{x:W/2,w:140}]; spawnLeft=true; speed=210; score=0; combo=0; camY=0; shake=0; particles=[]; floaters=[]; state='play'; over.classList.add('hidden'); spawn(); sync(); }
  function sync(){ elScore.textContent=score; elBest.textContent=best; elCombo.textContent=combo; }
  function blockY(i){ return groundY-(i+1)*BH+camY; }
  function burst(x,y,n,hue,power){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=(0.4+Math.random())*power; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:1,hue:hue+(Math.random()*30-15),size:2+Math.random()*3}); } }
  function floater(text,x,y,color){ floaters.push({text,x,y,life:1,color}); }

  function drop(){
    if(state!=='play') return;
    ensureAudio();
    const prev=blocks[blocks.length-1];
    const l=Math.max(prev.x-prev.w/2,moving.x-moving.w/2), r=Math.min(prev.x+prev.w/2,moving.x+moving.w/2);
    if(r<=l){ end(); return; }
    let w=r-l, x=(l+r)/2;
    const diff=Math.abs(moving.x-prev.x);
    const perfect=diff<=Math.max(7,prev.w*0.05);
    if(perfect){
      combo++; score+=2+Math.floor(combo/6);
      if(combo%5===0) w=Math.min(prev.w,w+2);
      beep(680+Math.min(combo,10)*45,0.1,'triangle',0.14,1000+Math.min(combo,10)*60);
      floater('PERFECT ×'+combo,x,blockY(blocks.length)-16,'#ffd166');
      burst(x,blockY(blocks.length)+BH/2,14,(x*7+blocks.length*40)%360,150);
      shake=Math.max(shake,2.5);
    } else {
      combo=0; score+=1;
      beep(300,0.08,'sine',0.1,180);
      burst(x,blockY(blocks.length)+BH/2,6,(blocks.length*38)%360,80);
    }
    blocks.push({x,w});
    speed=Math.min(560,210+blocks.length*5.5);
    spawn(); sync();
  }
  function end(){
    state='over'; beep(220,0.5,'sawtooth',0.16,60); shake=12;
    burst(moving.x,blockY(blocks.length),24,0,220);
    if(score>best){ best=score; localStorage.setItem('stackTowerBest',best); elRecord.textContent='🏆 新纪录！'; }
    else elRecord.textContent='最高分 '+best;
    elFinal.textContent=score; sync();
    setTimeout(()=>over.classList.remove('hidden'),420);
  }
  function roundRect(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawBlock(b,i,isMoving){
    const y=isMoving?blockY(blocks.length):blockY(i);
    const hue=(190+i*19)%360, x=b.x-b.w/2;
    ctx.save(); ctx.shadowColor='hsla('+hue+',90%,65%,.45)'; ctx.shadowBlur=14;
    const g=ctx.createLinearGradient(0,y,0,y+BH);
    g.addColorStop(0,'hsl('+hue+',85%,68%)'); g.addColorStop(1,'hsl('+(hue+18)+',75%,46%)');
    ctx.fillStyle=g; roundRect(x,y,b.w,BH,5); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.28)'; roundRect(x+3,y+2,Math.max(1,b.w-6),3,2); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.12)'; roundRect(x+3,y+BH-5,Math.max(1,b.w-6),3,2); ctx.fill();
  }
  function render(){
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#101a38'); bg.addColorStop(1,'#070b18'); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(122,162,255,.05)'; ctx.lineWidth=1;
    for(let y=0;y<H;y+=28){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.save(); if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    for(let i=0;i<blocks.length;i++){ const y=blockY(i); if(y>H+BH) continue; if(y<-BH) break; drawBlock(blocks[i],i,false); }
    ctx.fillStyle='rgba(122,162,255,.25)'; ctx.fillRect(0,groundY,W,2);
    if(state==='play'&&moving){
      drawBlock(moving,blocks.length,true);
      ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.setLineDash([4,5]);
      ctx.beginPath(); ctx.moveTo(moving.x,blockY(blocks.length)+BH); ctx.lineTo(moving.x,groundY); ctx.stroke(); ctx.setLineDash([]);
    }
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle='hsl('+p.hue+',90%,65%)'; ctx.fillRect(p.x,p.y,p.size,p.size); }
    ctx.globalAlpha=1;
    for(const f of floaters){ ctx.globalAlpha=Math.max(0,f.life); ctx.fillStyle=f.color; ctx.font='900 16px system-ui'; ctx.textAlign='center'; ctx.fillText(f.text,f.x,f.y); }
    ctx.globalAlpha=1; ctx.restore();
  }
  function update(dt){
    if(state==='play'&&moving){
      moving.x+=dir*speed*dt; const half=moving.w/2;
      if(moving.x<half){moving.x=half;dir=1;}
      if(moving.x>W-half){moving.x=W-half;dir=-1;}
    }
    const target=Math.max(0,blocks.length*BH-(groundY-130)); camY+=(target-camY)*Math.min(1,dt*7);
    shake=Math.max(0,shake-dt*30);
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=340*dt; p.life-=dt*1.6; }
    particles=particles.filter(p=>p.life>0);
    for(const f of floaters){ f.y-=42*dt; f.life-=dt*1.15; }
    floaters=floaters.filter(f=>f.life>0);
  }
  function loop(t){ const dt=Math.min(0.033,(t-last)/1000||0); last=t; update(dt); render(); requestAnimationFrame(loop); }
  stage.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; drop(); });
  window.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault(); drop();} if(e.key==='r'||e.key==='R') reset(); });
  document.getElementById('restart').onclick=reset; document.getElementById('again').onclick=reset;
  muteBtn.onclick=()=>{ sound=!sound; muteBtn.textContent=sound?'🔊':'🔇'; if(sound){ensureAudio(); beep(600,.08,'sine',.1);} };
  window.addEventListener('resize',resize);
  resize(); reset(); requestAnimationFrame(loop);
})();
</script>
<!-- 应用模式：屏蔽浏览器原生交互（选中/拖拽/右键菜单/双击缩放） -->
<script>
(function(){
  var EDITABLE='input,textarea,select,[contenteditable]';
  ['selectstart','dragstart'].forEach(function(type){ document.addEventListener(type,function(e){ if(e.target&&e.target.closest&&e.target.closest(EDITABLE))return; e.preventDefault(); }); });
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  ['gesturestart','gesturechange','gestureend'].forEach(function(type){ document.addEventListener(type,function(e){ e.preventDefault(); },{passive:false}); });
  window.addEventListener('wheel',function(e){ if(e.ctrlKey||e.metaKey)e.preventDefault(); },{passive:false});
  window.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>=0)e.preventDefault(); });
})();
</script>
</body>
</html>
