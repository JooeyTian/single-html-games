<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>武侠门派·世代传 · Martial Legacy</title>
<style>
  :root {
    --bg:#0f1719; --panel:#172124; --panel2:#1d292c; --line:#304348;
    --text:#e9e4d6; --dim:#9aa8a8; --jade:#5ec2a8; --cinnabar:#c9483f; --gold:#d9b45b;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"STKaiti","KaiTi","Microsoft YaHei",system-ui,sans-serif; }
  body { background:radial-gradient(900px 500px at 80% -10%,rgba(94,194,168,.08),transparent 70%),var(--bg); }
  #app { height:100vh; height:100dvh; display:flex; flex-direction:column; gap:7px; padding:7px; max-width:1300px; margin:0 auto; }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 12px; }
  .brand { font-size:18px; font-weight:800; letter-spacing:2px; white-space:nowrap; }
  .brand small { font-size:9px; letter-spacing:2px; color:var(--jade); margin-left:6px; }
  .seal { display:inline-grid; place-items:center; width:26px; height:26px; border:2px solid var(--cinnabar); color:var(--cinnabar); border-radius:4px; font-size:12px; font-weight:900; }
  .hud { display:flex; align-items:center; gap:13px; flex-wrap:wrap; margin-left:auto; }
  .hv { display:flex; flex-direction:column; min-width:44px; }
  .hv span { font-size:9px; color:var(--dim); letter-spacing:1px; }
  .hv b { font-size:16px; line-height:1.1; }
  #silverV { color:var(--gold); } #repV { color:var(--jade); } #legacyV { color:var(--cinnabar); }
  button { font-family:inherit; cursor:pointer; color:var(--text); background:#213034; border:1px solid var(--line); border-radius:7px; padding:6px 10px; font-size:12px; }
  button:hover:not(:disabled) { border-color:var(--jade); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.on { background:linear-gradient(135deg,#2f7d6a,#5ec2a8); color:#0f1719; border-color:transparent; font-weight:800; }
  .btn-red { background:linear-gradient(135deg,#8f2c28,#c9483f); border-color:transparent; font-weight:800; }
  .speeds { display:flex; gap:4px; }
  .speeds button { min-width:34px; padding:5px 7px; }
  .mobiletabs { display:none; gap:4px; padding:5px; overflow-x:auto; flex:none; }
  .mobiletabs button { flex:none; }
  .main { flex:1; min-height:0; display:flex; gap:8px; }
  .col { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px; overflow-y:auto; scrollbar-width:thin; }
  .col.left { width:255px; flex:none; }
  .col.mid { flex:1; min-width:0; }
  .col.right { width:270px; flex:none; }
  .col h3 { margin:2px 0 8px; font-size:13px; color:var(--jade); letter-spacing:1px; display:flex; justify-content:space-between; align-items:center; }
  .dcard { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; cursor:pointer; }
  .dcard:hover { border-color:var(--jade); }
  .dcard.sel { border-color:var(--jade); background:#223336; }
  .dcard .n { font-size:14px; font-weight:800; }
  .dcard .n small { font-size:10px; color:var(--dim); font-weight:400; margin-left:5px; }
  .dcard .m { font-size:10px; color:var(--dim); margin-top:2px; }
  .pill { font-size:10px; padding:2px 7px; border-radius:99px; background:#253538; border:1px solid var(--line); color:var(--dim); }
  .pill.red { color:#ffb3ad; border-color:rgba(201,72,63,.4); }
  .pill.gold { color:var(--gold); border-color:rgba(217,180,91,.4); }
  .attr { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0; }
  .attr div { background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:5px 9px; font-size:11px; }
  .attr b { color:var(--gold); font-size:14px; }
  .skill { margin:7px 0; }
  .skill .sn { display:flex; justify-content:space-between; font-size:12px; }
  .bar { height:7px; background:#243438; border-radius:5px; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#2f7d6a,#5ec2a8); }
  .bar.r i { background:linear-gradient(90deg,#8f2c28,#c9483f); }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:7px; }
  select { font-family:inherit; font-size:11px; color:var(--text); background:#213034; border:1px solid var(--line); border-radius:6px; padding:5px; }
  .log { font-size:11px; line-height:1.7; color:var(--dim); }
  .log div { border-bottom:1px solid rgba(48,67,72,.6); padding:2px 0; }
  .bcard { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; margin-bottom:6px; font-size:11px; }
  .bcard .t { display:flex; justify-content:space-between; font-weight:700; font-size:12px; }
  .bcard button { margin-top:5px; padding:4px 8px; font-size:11px; }
  .modal { position:fixed; inset:0; z-index:30; display:grid; place-items:center; background:rgba(6,12,14,.82); backdrop-filter:blur(3px); }
  .modal.hidden { display:none; }
  .scroll { width:min(480px,calc(100vw - 24px)); max-height:85dvh; overflow-y:auto; background:var(--panel); border:1px solid var(--jade); border-radius:12px; padding:20px 22px; box-shadow:0 20px 70px rgba(0,0,0,.6); }
  .scroll h2 { margin:0 0 6px; font-size:20px; letter-spacing:2px; }
  .scroll p { font-size:13px; line-height:1.8; color:#c8d2cd; }
  .scroll button { display:block; width:100%; margin-top:8px; padding:10px; font-size:13px; text-align:left; }
  .toast { position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:40; background:#213034; border:1px solid var(--jade); border-radius:8px; padding:8px 15px; font-size:12px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  @media (max-width:900px){
    #app { padding:5px; gap:5px; }
    .brand { width:100%; }
    .hud { width:100%; margin-left:0; justify-content:space-between; gap:7px; }
    .hv b { font-size:14px; }
    .mobiletabs { display:flex; }
    .main { flex-direction:column; }
    .col { display:none; width:100%!important; flex:1!important; }
    .col.active { display:block; }
  }
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  select { -webkit-user-select:text; user-select:text; }
  html,body { touch-action:manipulation; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand"><span class="seal">武</span> 武侠门派·世代传 <small>MARTIAL LEGACY</small></div>
    <div class="hud">
      <div class="hv"><span>年月</span><b id="dateV">1年1月</b></div>
      <div class="hv"><span>银两</span><b id="silverV">0</b></div>
      <div class="hv"><span>声望</span><b id="repV">0</b></div>
      <div class="hv"><span>弟子</span><b id="discV">0</b></div>
      <div class="hv"><span>传承</span><b id="legacyV">0</b></div>
      <div class="speeds">
        <button data-sp="0">⏸</button><button data-sp="1">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button>
      </div>
    </div>
  </div>
  <div class="mobiletabs">
    <button class="on" data-col="left">弟子</button><button data-col="mid">详情</button>
    <button data-col="right">门派</button><button data-col="log">事件</button><button data-col="legacy">传承</button>
  </div>
  <div class="main">
    <div class="col left active" id="colLeft"><h3>门下弟子 <span class="pill" id="leftCount"></span></h3><div id="discList"></div></div>
    <div class="col mid" id="colMid"><h3 id="detailTitle">弟子详情</h3><div id="detail"></div></div>
    <div class="col right" id="colRight"><h3>门派经营</h3><div id="buildList"></div><h3>秘籍与丹药</h3><div id="bookBox"></div><h3>江湖传闻</h3><div class="log" id="logBox"></div></div>
  </div>
</div>
<div class="modal hidden" id="modal"><div class="scroll" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  'use strict';
  const KEY='martialLegacySave_v1';
  const $=s=>document.querySelector(s);
  let toastTimer=null;
  function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1500); }
  const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
  const SURNAMES=['云','李','沈','叶','苏','楚','萧','顾','林','陆','东方','独孤','慕容','司徒'];
  const GIVEN=['无涯','清扬','若水','惊鸿','长风','知微','承影','抱朴','听雪','观澜','星河','照野','忘机','青鸾'];
  const TRAITS=[
    {n:'聪慧',c:0,co:3},{n:'根骨奇佳',r:4},{n:'意志坚定',w:4},{n:'福泽深厚',f:4},
    {n:'体弱多病',r:-3,h:-15},{n:'桀骜不驯',w:3,f:-2},{n:'温良恭俭',w:2,f:2},
    {n:'悟性超群',co:5},{n:'天赋异禀',r:2,co:2,w:2,f:2},{n:'八面玲珑',f:3,co:1}
  ];
  const SKILLS={neigong:'内功',waigong:'外功',qinggong:'轻功',jueji:'绝技'};
  const TASKS=['练功','炼丹','铸剑','经商','闭关','侍奉'];
  const BOOKS=['青云心法','流云剑诀','踏雪无痕','寒潭真经','天罡指法','碧落箫谱'];
  const BUILDINGS={练武场:'修炼经验 +15% / 级',藏经阁:'秘籍残卷获取 + / 级',丹房:'炼丹成功率 + / 级',铁匠铺:'铸剑成功率 + / 级',客栈:'每月银两收入 +',山门:'门派声望获取 + / 级'};
  let state=null,selected=null,modalOpen=false;

  function newDisciple(age,role){
    const d={
      id:state.nextId++,name:pick(SURNAMES)+pick(GIVEN),gender:Math.random()<.5?'男':'女',age:(age===0?0:(age||16)),
      root:6+rnd(11),comprehension:6+rnd(11),will:6+rnd(11),fortune:6+rnd(11),
      traits:[],health:0,maxHealth:0,task:'练功',role:role||'弟子',alive:true,
      skills:{neigong:{lv:1,xp:0},waigong:{lv:1,xp:0},qinggong:{lv:1,xp:0},jueji:{lv:0,xp:0}},
      mentor:null,spouse:null,weapon:0,children:[],parents:[]
    };
    const t1=pick(TRAITS); d.traits.push(t1.n); applyTrait(d,t1);
    if(Math.random()<.35){ const t2=pick(TRAITS); if(!d.traits.includes(t2.n)){ d.traits.push(t2.n); applyTrait(d,t2); } }
    d.root=Math.max(3,d.root); d.comprehension=Math.max(3,d.comprehension);
    d.life=58+Math.floor(d.root/3)+Math.floor(d.fortune/4)+rnd(14);
    d.maxHealth=60+d.root*4+(d.traits.includes('体弱多病')?-15:0); d.health=d.maxHealth;
    return d;
  }
  function applyTrait(d,t){ if(t.r) d.root+=t.r; if(t.co) d.comprehension+=t.co; if(t.w) d.will+=t.w; if(t.f) d.fortune+=t.f; if(t.h) d.maxHealth+=t.h; }
  function founder(){
    const d=newDisciple(20,'掌门'); d.name='云无涯'; d.root+=3; d.comprehension+=3; d.will+=3;
    return d;
  }
  function initial(){
    return {version:1,sectName:'青云门',month:0,speed:1,silver:260,rep:0,
      disciples:[],buildings:{练武场:1,藏经阁:1,丹房:1,铁匠铺:1,客栈:1,山门:1},
      books:[],fragments:0,elixirs:2,weapons:0,log:[],ancestors:[],nextId:1,
      eventCd:10,lastEvent:null,succession:false,pendingPair:null};
  }
  function log(m){ state.log.unshift((Math.floor(state.month/12)+1)+'年'+(state.month%12+1)+'月 · '+m); if(state.log.length>80) state.log.length=80; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
  function load(){
    try{ const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.version===1){ state=d; return; } } }catch(e){}
    state=initial(); state.disciples=[founder()];
    log('青云门开宗立派。掌门云无涯立于山门之下。');
  }
  const alive=()=>state.disciples.filter(d=>d.alive);
  function getMaster(){ return alive().find(d=>d.role==='掌门'); }
  function legacyBonus(){ return 1+state.ancestors.length*.015+state.books.length*.05; }
  function training(d,key,mult){
    const s=d.skills[key]; if(key==='jueji'&&!state.books.length) return;
    const base=key==='neigong'?d.comprehension*.45+d.root*.15:key==='waigong'?d.will*.4+d.root*.2:key==='qinggong'?d.comprehension*.3+d.will*.2:d.comprehension*.35+d.fortune*.15;
    let gain=base*(1+state.buildings.练武场*.15)*legacyBonus()*(mult||1);
    if(d.mentor) gain*=1.2;
    if(d.weapon) gain*=1+d.weapon*.08;
    s.xp+=gain;
    while(s.xp>=100*Math.max(1,s.lv)&&s.lv<9){ s.xp-=100*Math.max(1,s.lv); s.lv++; log(d.name+' 的'+SKILLS[key]+'突破至 '+s.lv+' 层。'); }
    if(s.lv>=9) s.xp=Math.min(s.xp,900);
  }

  // ---------- events ----------
  const EVENTS=[
    {id:'dao',title:'云游道人',text:'一位白发道人停在山门前，愿以一段心法换些盘缠。',
      choices:[
        {t:'执弟子礼，求教心法',f:()=>{ alive().forEach(d=>training(d,'neigong',1.6)); state.rep+=5; log('道人留下心法，众弟子内功精进。'); }},
        {t:'赠银五十两，恭送出山',f:()=>{ state.silver=Math.max(0,state.silver-50); state.rep+=12; log('道人受了银两，留下一段佳话。'); }},
        {t:'闭门不见',f:()=>{ log('山门紧闭，道人飘然而去。'); }}
      ]},
    {id:'challenge',title:'山门挑衅',text:'江湖客登门挑战，言辞咄咄逼人。',
      choices:[
        {t:'列阵迎战',f:()=>{ const d=pick(alive()); if(d){ d.health=Math.max(1,d.health-18); } state.silver+=90; state.rep+=15; log('击退来敌，缴获银两九十两。'); }},
        {t:'以礼相待，化敌为友',f:()=>{ state.silver=Math.max(0,state.silver-30); state.rep+=8; log('一杯淡酒，化干戈为玉帛。'); }},
        {t:'忍辱闭门',f:()=>{ state.rep-=10; log('门人忍气吞声，声望受损。'); }}
      ]},
    {id:'secret',title:'秘境现世',text:'后山忽现一道石门，隐隐有灵气溢出。',
      choices:[
        {t:'派人探索',f:()=>{ const d=pick(alive()); if(!d) return; if(d.fortune+rnd(20)>14){ state.fragments+=2; log(d.name+' 寻得两卷秘籍残卷。'); } else { d.health=Math.max(1,d.health-25); log(d.name+' 负伤而归。'); } }},
        {t:'掌门亲自前往',f:()=>{ const m=getMaster(); if(!m) return; const pool=BOOKS.filter(b=>!state.books.includes(b));
          const ok=m.root+rnd(20)>14;
          if(ok&&pool.length){ state.books.push(pick(pool)); state.rep+=12; log('掌门得秘籍《'+state.books[state.books.length-1]+'》，声望大振。'); }
          else if(ok){ state.fragments+=2; log('掌门带回两卷残卷。'); }
          else { m.health=Math.max(1,m.health-30); log('掌门遇险，重伤回山。'); } }},
        {t:'封山不探究',f:()=>{ log('石门重新封禁，灵气渐散。'); }}
      ]},
    {id:'bounty',title:'官府悬赏',text:'县衙悬赏剿灭山贼，赏银丰厚。',
      choices:[
        {t:'接下悬赏',f:()=>{ const d=pick(alive()); if(d) d.health=Math.max(1,d.health-12); state.silver+=130; state.rep+=10; log('山贼授首，赏银入库。'); }},
        {t:'婉言谢绝',f:()=>{ log('门派闭门谢客，专心修炼。'); }}
      ]},
    {id:'plague',title:'山中疫病',text:'门中弟子接连发热，丹房告急。',
      choices:[
        {t:'开仓施药',f:()=>{ if(state.elixirs>=2){ state.elixirs-=2; alive().forEach(d=>d.health=Math.min(d.maxHealth,d.health+25)); log('丹药分发下去，疫情渐消。'); } else { log('丹药不足，只能以草药暂缓。'); } }},
        {t:'隔离病患',f:()=>{ alive().forEach(d=>d.health=Math.max(1,d.health-8)); log('病患隔离，门人虽有怨言却保住根基。'); }}
      ]},
    {id:'marriage',title:'情愫暗生',text:'两名弟子在练武场朝夕相处，似有情意。',
      choices:[
        {t:'成全道侣',f:()=>{ const list=alive().filter(d=>!d.spouse&&d.age>=20); if(list.length>=2){ const a=list[0],b=list[1]; a.spouse=b.id; b.spouse=a.id; state.rep+=4; log(a.name+' 与 '+b.name+' 结为道侣。'); } }},
        {t:'劝其专心修行',f:()=>{ log('掌门训话，两人各自收敛。'); }}
      ]},
    {id:'tourney',title:'武林大会',text:'各派齐聚，论剑争锋。',
      choices:[
        {t:'派弟子参赛',f:()=>{ const d=alive().sort((a,b)=>b.root-a.root)[0]; if(d){ state.rep+=14+Math.floor(d.root/3); d.skills.waigong.xp+=45; log(d.name+' 在大会上崭露头角。'); } }},
        {t:'只观礼不参赛',f:()=>{ state.rep+=3; log('门人旁观群雄论剑，略有心得。'); }}
      ]}
  ];
  function triggerEvent(){
    const pool=EVENTS.filter(e=>e.id!=='marriage'||alive().filter(d=>!d.spouse&&d.age>=20).length>=2);
    const ev=pick(pool);
    state.lastEvent={id:ev.id}; state.speed=0; modalOpen=true;
    const body=$('#modalBody');
    body.innerHTML='<h2>『'+ev.title+'』</h2><p>'+ev.text+'</p>'+ev.choices.map((c,i)=>'<button data-choice="'+i+'">'+c.t+'</button>').join('');
    $('#modal').classList.remove('hidden');
  }
  $('#modalBody').addEventListener('click',e=>{
    const b=e.target.closest('button[data-choice]'); if(!b||!state.lastEvent) return;
    const ev=EVENTS.find(x=>x.id===state.lastEvent.id);
    if(ev&&ev.choices[+b.dataset.choice]) ev.choices[+b.dataset.choice].f();
    state.lastEvent=null; modalOpen=false; $('#modal').classList.add('hidden');
    save(); renderAll(); toast('江湖事件已结');
  });

  // ---------- monthly tick ----------
  function die(d){
    d.alive=false; d.role=d.role==='掌门'?'先掌门':'先弟子';
    state.ancestors.push({name:d.name,age:d.age,rep:state.rep,lv:d.skills.neigong.lv+ d.skills.waigong.lv,role:d.role});
    if(state.ancestors.length>40) state.ancestors.shift();
    log(d.name+' 寿终，享年 '+d.age+' 岁。');
    if(d.role==='先掌门'){ state.succession=true; state.speed=0; showSuccession(); }
  }
  function monthly(){
    state.month++;
    for(const d of state.disciples){
      if(!d.alive) continue;
      if(state.month%12===0){ d.age++; if(d.age>d.life||d.health<=0){ die(d); continue; } }
      const b=state.buildings;
      if(d.task==='练功'){ training(d,'neigong'); training(d,'waigong'); }
      else if(d.task==='炼丹'){ if(Math.random()<.18+d.comprehension*.015+b.丹房*.05) { state.elixirs++; log(d.name+' 炼成一枚丹药。'); } training(d,'neigong',.3); }
      else if(d.task==='铸剑'){ if(Math.random()<.15+d.will*.015+b.铁匠铺*.05) { state.weapons++; log(d.name+' 铸成一柄新剑。'); } training(d,'waigong',.4); }
      else if(d.task==='经商'){ const gain=Math.round((5+d.fortune*.7+b.客栈*3)*legacyBonus()); state.silver+=gain; }
      else if(d.task==='闭关'){ training(d,'neigong',2.3); d.health=Math.max(1,d.health-3); }
      else if(d.task==='侍奉'){ d.health=Math.min(d.maxHealth,d.health+5); state.rep+=1+b.山门*.5|0; training(d,'qinggong',.4); }
      if(d.mentor){ const m=state.disciples.find(x=>x.id===d.mentor); if(!m||!m.alive) d.mentor=null; }
    }
    // children
    if(state.month%12===0){
      const pairs=alive().filter(d=>d.spouse&&d.age>=20&&d.age<=45);
      for(const d of pairs){ const mate=state.disciples.find(x=>x.id===d.spouse);
        if(!mate||!mate.alive||mate.id<d.id) continue;
        if(Math.random()<.28){ const child=newDisciple(0); child.name=pick([d.name[0],mate.name[0]])+pick(GIVEN);
          child.root=Math.round((d.root+mate.root)/2)+rnd(5)-1; child.comprehension=Math.round((d.comprehension+mate.comprehension)/2)+rnd(5)-1;
          child.will=Math.round((d.will+mate.will)/2)+rnd(5)-1; child.fortune=Math.round((d.fortune+mate.fortune)/2)+rnd(5)-1;
          child.parents=[d.id,mate.id]; d.children.push(child.id); mate.children.push(child.id);
          state.disciples.push(child); log(d.name+' 与 '+mate.name+' 育有一子：'+child.name+'。'); }
      }
    }
    // children grow
    for(const d of state.disciples) if(d.alive&&d.age===0&&d.parents.length&&state.month%12===0) d.age++;
    if(Math.random()<.1+state.buildings.藏经阁*.04){ state.fragments++; if(state.fragments>=3){ state.fragments=0;
      const pool=BOOKS.filter(b=>!state.books.includes(b)); if(pool.length){ const b=pick(pool); state.books.push(b); log('藏经阁集齐残卷，得秘籍《'+b+'》。'); } } }
    if(!alive().length){ log('门派凋零，只剩传承记忆。'); showRefound(); state.speed=0; return; }
    state.eventCd--;
    if(state.eventCd<=0&&!modalOpen&&!state.succession){ triggerEvent(); state.eventCd=9+rnd(13); }
    save(); renderAll();
  }
  function showSuccession(){
    const list=alive().filter(d=>d.role!=='掌门').sort((a,b)=>b.root+b.comprehension-a.root-a.comprehension);
    const body=$('#modalBody');
    body.innerHTML='<h2>掌门继任</h2><p>先掌门已逝，请择一新掌门主持山门。继任者将继承秘籍、建筑与传承记忆。</p>'
      +(list.length?list.map(d=>'<button data-succ="'+d.id+'">'+d.name+'（'+d.age+'岁 · 根骨'+d.root+' 悟性'+d.comprehension+'）</button>').join(''):'<p>门中已无人可继。</p>')
      +(!list.length?'<button data-refound="1">重开山门</button>':'');
    $('#modal').classList.remove('hidden'); modalOpen=true;
  }
  function showRefound(){
    const body=$('#modalBody');
    body.innerHTML='<h2>重开山门</h2><p>门中弟子尽散，但传承记忆尚存。你可另立新掌门，沿用门派建筑与秘籍，先辈的余荫仍会庇佑门人。</p><button data-refound="1">重开山门</button>';
    $('#modal').classList.remove('hidden'); modalOpen=true;
  }
  $('#modalBody').addEventListener('click',e=>{
    const s=e.target.closest('button[data-succ]'),r=e.target.closest('button[data-refound]');
    if(s){ const d=state.disciples.find(x=>x.id===+s.dataset.succ); if(d){ d.role='掌门'; state.succession=false; log(d.name+' 继任掌门，执掌青云门。'); } }
    else if(r){ state.succession=false; const f=founder(); state.disciples=[f]; state.silver=Math.max(120,state.silver); log('山门重开，'+f.name+' 出任掌门。'); }
    else return;
    modalOpen=false; $('#modal').classList.add('hidden'); save(); renderAll();
  });

  // ---------- UI ----------
  function renderDiscipleList(){
    const list=alive();
    $('#leftCount').textContent=list.length+' 人';
    $('#discList').innerHTML=list.map(d=>{
      const role=d.role==='掌门'?'<span class="pill gold">掌门</span>':d.age<12?'<span class="pill">幼童</span>':'';
      return '<div class="dcard '+(selected===d.id?'sel':'')+'" data-d="'+d.id+'">'
        +'<div class="n">'+d.name+' '+role+' <small>'+d.gender+' · '+d.age+'岁</small></div>'
        +'<div class="m">'+d.traits.join(' · ')+(d.spouse?' · 已有道侣':'')+'</div>'
        +'<div class="m">内功 '+d.skills.neigong.lv+' · 外功 '+d.skills.waigong.lv+' · 轻功 '+d.skills.qinggong.lv+'</div>'
        +'<div class="bar"><i style="width:'+Math.max(0,d.health/d.maxHealth*100)+'%"></i></div></div>';
    }).join('')||'<div class="log">门中无人</div>';
  }
  function renderDetail(){
    const d=alive().find(x=>x.id===selected)||alive()[0];
    if(!d){ $('#detailTitle').textContent='弟子详情'; $('#detail').innerHTML='<div class="log">暂无弟子</div>'; return; }
    selected=d.id;
    $('#detailTitle').textContent=d.name+' · '+d.role;
    let h='<div class="attr">'
      +'<div>根骨 <b>'+d.root+'</b></div><div>悟性 <b>'+d.comprehension+'</b></div>'
      +'<div>毅力 <b>'+d.will+'</b></div><div>福缘 <b>'+d.fortune+'</b></div>'
      +'<div>寿命 <b>'+d.life+'</b></div><div>气血 <b>'+Math.round(d.health)+'/'+d.maxHealth+'</b></div></div>';
    h+='<div class="log">性情：'+d.traits.join('、')+'　师父：'+((state.disciples.find(x=>x.id===d.mentor)||{}).name||'无')+'　佩剑：'+(d.weapon?'+'+d.weapon:'无')+'</div>';
    for(const k in SKILLS){ const s=d.skills[k],th=100*Math.max(1,s.lv);
      h+='<div class="skill"><div class="sn"><span>'+SKILLS[k]+' · '+s.lv+' 层</span><span>'+Math.floor(s.xp)+' / '+th+'</span></div>'
        +'<div class="bar '+(s.lv>=9?'r':'')+'"><i style="width:'+Math.min(100,s.xp/th*100)+'%"></i></div></div>'; }
    h+='<div class="row"><span class="pill">每月功课</span><select id="taskSel">'+TASKS.map(t=>'<option '+(d.task===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div>';
    h+='<div class="row"><span class="pill">授业师父</span><select id="mentorSel"><option value="0">无</option>'
      +alive().filter(x=>x.id!==d.id&&x.age>=16).map(x=>'<option value="'+x.id+'" '+(d.mentor===x.id?'selected':'')+'>'+x.name+'</option>').join('')+'</select></div>';
    h+='<div class="row">';
    h+='<button data-act="break" '+(d.skills.neigong.xp<100||state.elixirs<1?'disabled':'')+'>内功突破（丹药 1）</button>';
    h+='<button data-act="elixir" '+(state.elixirs<1?'disabled':'')+'>赐药疗伤（丹药 1）</button>';
    h+='<button data-act="sword" '+(state.weapons<1?'disabled':'')+'>赐剑（佩剑 +1）</button>';
    h+='<button data-act="pair" '+(state.pendingPair&&state.pendingPair!==d.id?'class="btn-red"':'')+'>'+(state.pendingPair===d.id?'取消结缘':'结为道侣')+'</button>';
    if(d.role==='掌门') h+='<button data-act="retire" '+(d.age<55?'disabled':'')+'>退位传禅</button>';
    h+='</div><div class="log" style="margin-top:8px">子女：'+(d.children.length?d.children.map(id=>(state.disciples.find(x=>x.id===id)||{}).name||'?').join('、'):'无')+'</div>';
    $('#detail').innerHTML=h;
  }
  function renderSect(){
    $('#buildList').innerHTML=Object.keys(BUILDINGS).map(k=>{
      const lv=state.buildings[k],cost=Math.round(80*Math.pow(lv,1.5));
      return '<div class="bcard"><div class="t"><span>'+k+' Lv'+lv+'</span><span class="pill">声望 '+lv*5+'</span></div>'
        +'<div class="log">'+BUILDINGS[k]+'</div><button data-build="'+k+'" '+(state.silver<cost||state.rep<lv*5?'disabled':'')+'>扩建（'+cost+' 两）</button></div>';
    }).join('');
    $('#bookBox').innerHTML='<div class="bcard"><div class="t"><span>秘籍</span><span>'+state.books.length+' 部</span></div><div class="log">'+(state.books.join('、')||'尚无秘籍')+'</div></div>'
      +'<div class="bcard"><div class="t"><span>残卷</span><span>'+state.fragments+' / 3</span></div>'
      +'<div class="log">丹药 '+state.elixirs+' 枚 · 佩剑 '+state.weapons+' 柄</div></div>'
      +'<div class="log">先辈余荫：修炼效率 +'+Math.round((legacyBonus()-1)*100)+'%</div>';
    $('#logBox').innerHTML=state.log.slice(0,30).map(x=>'<div>· '+x+'</div>').join('');
  }
  function renderAll(){ renderDiscipleList(); renderDetail(); renderSect();
    $('#dateV').textContent=(Math.floor(state.month/12)+1)+'年'+(state.month%12+1)+'月';
    $('#silverV').textContent=state.silver; $('#repV').textContent=Math.floor(state.rep);
    $('#discV').textContent=alive().length; $('#legacyV').textContent=state.ancestors.length;
    document.querySelectorAll('[data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===state.speed));
  }
  $('#discList').addEventListener('click',e=>{ const c=e.target.closest('[data-d]'); if(!c) return;
    const id=+c.dataset.d;
    if(state.pendingPair&&state.pendingPair!==id){ const a=state.disciples.find(x=>x.id===state.pendingPair),b=state.disciples.find(x=>x.id===id);
      if(a&&b&&a.alive&&b.alive&&!a.spouse&&!b.spouse&&a.age>=20&&b.age>=20){ a.spouse=b.id; b.spouse=a.id; state.rep+=4; log(a.name+' 与 '+b.name+' 结为道侣。'); toast('二人结为道侣'); }
      state.pendingPair=null; }
    selected=id; renderAll(); });
  $('#detail').addEventListener('change',e=>{ const d=alive().find(x=>x.id===selected); if(!d) return;
    if(e.target.id==='taskSel'){ d.task=e.target.value; toast('功课改为：'+d.task); }
    if(e.target.id==='mentorSel'){ d.mentor=+e.target.value||null; toast('师父已指定'); }
    save(); renderAll(); });
  $('#detail').addEventListener('click',e=>{ const b=e.target.closest('button[data-act]'); if(!b) return;
    const d=alive().find(x=>x.id===selected); if(!d) return; const a=b.dataset.act;
    if(a==='break'){ if(state.elixirs<1||d.skills.neigong.xp<100*Math.max(1,d.skills.neigong.lv)) return;
      state.elixirs--; const chance=.45+d.comprehension*.008+d.fortune*.004-d.skills.neigong.lv*.03;
      if(Math.random()<chance){ d.skills.neigong.lv++; d.skills.neigong.xp=0; state.rep+=3; log(d.name+' 内功突破至 '+d.skills.neigong.lv+' 层！'); toast('突破成功！'); }
      else { d.skills.neigong.xp=Math.floor(d.skills.neigong.xp/2); log(d.name+' 突破失败，真气受损。'); toast('突破失败'); } }
    else if(a==='elixir'){ if(state.elixirs<1) return; state.elixirs--; d.health=Math.min(d.maxHealth,d.health+30); toast('气血恢复'); }
    else if(a==='sword'){ if(state.weapons<1) return; state.weapons--; d.weapon++; toast('佩剑 +1'); }
    else if(a==='pair'){ state.pendingPair=state.pendingPair===d.id?null:d.id; toast(state.pendingPair?'已选中，请点另一位弟子':'取消结缘'); }
    else if(a==='retire'){ if(d.age<55) return; d.role='先掌门'; state.succession=true; showSuccession(); state.speed=0; }
    save(); renderAll(); });
  $('#buildList').addEventListener('click',e=>{ const b=e.target.closest('button[data-build]'); if(!b) return;
    const k=b.dataset.build, lv=state.buildings[k],cost=Math.round(80*Math.pow(lv,1.5));
    if(state.silver<cost||state.rep<lv*5) return; state.silver-=cost; state.buildings[k]++; log(k+' 扩建至 Lv'+state.buildings[k]+'。'); save(); renderAll(); });
  document.querySelectorAll('[data-sp]').forEach(b=>b.addEventListener('click',()=>{
    if(modalOpen||state.succession) return; state.speed=+b.dataset.sp; save(); renderAll(); }));
  document.querySelectorAll('.mobiletabs button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.mobiletabs button').forEach(x=>x.classList.toggle('on',x===b));
    const c=b.dataset.col;
    document.querySelectorAll('.col').forEach(x=>x.classList.remove('active'));
    if(c==='log'||c==='legacy'){ $('#colRight').classList.add('active'); if(c==='legacy') $('#colRight').scrollTop=$('#colRight').scrollHeight; }
    else $('#col'+c.charAt(0).toUpperCase()+c.slice(1)).classList.add('active');
  }));

  let last=0,acc=0;
  function loop(t){
    const dt=Math.min(.1,(t-last)/1000||0); last=t;
    if(state.speed>0&&!modalOpen&&!state.succession){
      acc+=dt*state.speed*(1/1.2);
      let guard=0; while(acc>=1&&guard++<8){ monthly(); acc-=1; if(modalOpen||state.succession) break; }
    } else acc=0;
    requestAnimationFrame(loop);
  }
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
  setInterval(save,10000);
  load();
  if(state.lastEvent){ const ev=EVENTS.find(x=>x.id===state.lastEvent.id); if(ev){ modalOpen=true; state.speed=0;
    $('#modalBody').innerHTML='<h2>『'+ev.title+'』</h2><p>'+ev.text+'</p>'+ev.choices.map((c,i)=>'<button data-choice="'+i+'">'+c.t+'</button>').join(''); $('#modal').classList.remove('hidden'); } }
  if(state.succession) showSuccession();
  if(!selected&&alive().length) selected=alive()[0].id;
  renderAll(); requestAnimationFrame(loop);
})();
</script>
<!-- 应用模式：屏蔽浏览器原生交互（选中/拖拽/右键菜单/双击缩放） -->
<script>
(function(){
  var EDITABLE='input,textarea,select,[contenteditable]';
  ['selectstart','dragstart'].forEach(function(type){ document.addEventListener(type,function(e){ if(e.target&&e.target.closest&&e.target.closest(EDITABLE))return; e.preventDefault(); }); });
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  ['gesturestart','gesturechange','gestureend'].forEach(function(type){ document.addEventListener(type,function(e){ e.preventDefault(); },{passive:false}); });
  window.addEventListener('wheel',function(e){ if(e.ctrlKey||e.metaKey)e.preventDefault(); },{passive:false});
  window.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>=0)e.preventDefault(); });
})();
</script>
</body>
</html>
