<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>六角拼图 · Hex Puzzle</title>
<style>
  :root { --bg:#080d1a; --panel:#121b32; --line:#263355; --text:#e9efff; --dim:#92a2c6; --accent:#7aa2ff; --gold:#ffd166; }
  * { box-sizing:border-box; }
  html,body {
    margin:0; min-height:100%; color:var(--text); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:radial-gradient(800px 500px at 85% -10%,rgba(90,125,255,.16),transparent 70%),
               radial-gradient(600px 400px at 0% 100%,rgba(167,139,250,.10),transparent 70%),var(--bg);
  }
  #app { height:100vh; height:100dvh; display:flex; flex-direction:column; gap:8px; padding:8px; max-width:900px; margin:0 auto; }
  .top { display:flex; align-items:center; gap:9px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:7px 12px; }
  .brand { font-size:16px; font-weight:900; white-space:nowrap; }
  .brand small { font-size:9px; color:var(--accent); letter-spacing:2px; margin-left:5px; }
  .stats { display:flex; align-items:center; gap:13px; margin-left:auto; }
  .stat { display:flex; flex-direction:column; min-width:44px; }
  .stat span { font-size:9px; color:var(--dim); letter-spacing:1px; }
  .stat b { font-size:17px; line-height:1.1; }
  #best b { color:var(--gold); }
  #combo b { color:#ff9a5b; }
  button { font-family:inherit; cursor:pointer; color:var(--text); background:#1e2a48; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12px; }
  button:active { transform:translateY(1px); }
  .btn-main { background:linear-gradient(135deg,#4a6cf0,#7a5cf0); border-color:transparent; font-weight:700; }
  .main { flex:1; min-height:0; display:flex; gap:12px; justify-content:center; align-items:center; }
  .stage { position:relative; flex:none; }
  canvas#cv {
    display:block; width:min(520px, calc(100vw - 16px), calc((100vh - 165px)), calc((100dvh - 165px)));
    aspect-ratio:1; height:auto; border:1px solid var(--line); border-radius:14px; touch-action:none;
    background:radial-gradient(circle at 50% 45%,#162342,#0a1124);
    box-shadow:0 14px 40px rgba(0,0,0,.35);
  }
  .side { width:220px; align-self:stretch; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-size:12px; line-height:1.7; color:var(--dim); }
  .box h3 { margin:0 0 5px; font-size:13px; color:var(--text); }
  .box b { color:var(--gold); }
  #prev { display:block; margin:2px auto 0; width:130px; height:64px; }
  .over { position:absolute; inset:0; display:grid; place-items:center; background:rgba(5,8,18,.8); backdrop-filter:blur(4px); border-radius:14px; z-index:3; }
  .over.hidden { display:none; }
  .card { text-align:center; padding:22px 28px; border:1px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:0 20px 60px rgba(0,0,0,.55); }
  .card h2 { margin:0 0 6px; font-size:24px; }
  .card p { margin:0 0 4px; color:var(--dim); font-size:12px; }
  .card .big { font-size:40px; font-weight:900; color:var(--gold); margin:6px 0; }
  .card button { margin-top:12px; font-size:14px; padding:9px 24px; border:0; font-weight:700; background:linear-gradient(135deg,#4a6cf0,#7a5cf0); }
  .mobilebar { display:none; gap:8px; }
  @media (max-width:720px){
    .side { display:none; }
    .main { align-items:flex-start; }
    .mobilebar { display:flex; }
    .mobilebar button { flex:1; padding:12px; font-size:14px; }
    .stat b { font-size:15px; }
  }
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html,body { touch-action:manipulation; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">⬡ 六角拼图 <small>HEX PUZZLE</small></div>
    <div class="stats">
      <div class="stat"><span>分数</span><b id="score">0</b></div>
      <div class="stat" id="best"><span>最高</span><b>0</b></div>
      <div class="stat" id="combo"><span>连消</span><b>0</b></div>
      <button id="rot">旋转 R</button>
      <button id="restart">重开</button>
    </div>
  </div>
  <div class="main">
    <div class="stage">
      <canvas id="cv" width="520" height="520"></canvas>
      <div class="over hidden" id="over">
        <div class="card">
          <h2>无处可放 ⬡</h2>
          <p>本局分数</p><div class="big" id="final">0</div>
          <p id="record"></p>
          <button id="again">再来一局</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="box"><h3>怎么玩</h3>把形状拖到棋盘上点击放下。<b>填满任意一条直线</b>即可消除该行；连续消行会让分数翻倍。棋盘塞满且无处可放时结束。</div>
      <div class="box"><h3>当前形状</h3><canvas id="prev" width="260" height="128"></canvas><span id="pieceInfo"></span></div>
      <div class="box"><h3>操作</h3>移动鼠标 / 手指定位，点击放置；<b>右键 / R / 旋转按钮</b>转动形状。手机点下方大按钮旋转。</div>
      <div class="box"><h3>消除方向</h3>三个方向都能消：横排、右下斜排、左下斜排。越长的线一次消掉越划算。</div>
    </div>
  </div>
  <div class="mobilebar"><button id="rotM" class="btn-main">↻ 旋转形状</button><button id="restartM">↻ 重新开始</button></div>
</div>
<script>
(function(){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), prev=document.getElementById('prev'), pctx=prev.getContext('2d');
  const W=520,H=520,N=4,S=29,SQ3=Math.sqrt(3),CX=260,CY=260;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  const DIRS=[[1,0],[0,1],[-1,1]];
  const COLORS=['#7aa2ff','#a78bfa','#34d399','#fbbf24','#fb7185','#38bdf8'];
  const elScore=document.getElementById('score'), elBest=document.querySelector('#best b'), elCombo=document.querySelector('#combo b');
  const pieceInfo=document.getElementById('pieceInfo');
  const over=document.getElementById('over'), elFinal=document.getElementById('final'), elRecord=document.getElementById('record');
  let board=new Map(), lines=[], piece=null, score=0, combo=0, best=+(localStorage.getItem('hexPuzzleBest')||0);
  let particles=[],floaters=[],state='play',last=0,actx=null,sound=true;

  function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
  function beep(freq,dur,type,vol,slide){
    if(!sound||!actx) return;
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),actx.currentTime+dur);
    g.gain.setValueAtTime(vol||0.11,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }
  function key(q,r){ return q+','+r; }
  function inBoard(q,r){ return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=N; }
  function cellPos(q,r){ return {x:CX+SQ3*S*(q+r/2),y:CY+1.5*S*r}; }
  function roundAxial(q,r){
    let x=q,z=r,y=-q-r,rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);
    const dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);
    if(dx>dy&&dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
    return {q:rx,r:rz};
  }
  function toAxial(px,py){
    const x=px-CX,y=py-CY;
    return roundAxial((SQ3/3*x-y/3)/S,(2/3*y)/S);
  }
  function initBoard(){
    board=new Map(); lines=[];
    for(let q=-N;q<=N;q++){
      const lo=Math.max(-N,-q-N), hi=Math.min(N,-q+N);
      for(let r=lo;r<=hi;r++) board.set(key(q,r),{q,r,c:null,flash:0});
    }
    for(let d=0;d<3;d++){
      const groups=new Map();
      for(const cell of board.values()){
        const id=d===0?('r'+cell.r):d===1?('q'+cell.q):('s'+(cell.q+cell.r));
        if(!groups.has(id)) groups.set(id,[]);
        groups.get(id).push(cell);
      }
      for(const arr of groups.values()) if(arr.length>=3) lines.push(arr);
    }
  }
  function cells(p){
    const out=[];
    for(let i=0;i<p.len;i++) out.push([p.q+i*DIRS[p.dir][0],p.r+i*DIRS[p.dir][1]]);
    return out;
  }
  function valid(q,r,dir,len){
    for(let i=0;i<len;i++){
      const cq=q+i*DIRS[dir][0],cr=r+i*DIRS[dir][1];
      if(!inBoard(cq,cr)) return false;
      const c=board.get(key(cq,cr));
      if(!c||c.c!==null) return false;
    }
    return true;
  }
  function gen(){
    const x=Math.random();
    const len=x<0.18?1:x<0.68?2:3;
    piece={q:0,r:-1,len,dir:Math.floor(Math.random()*3),color:COLORS[Math.floor(Math.random()*COLORS.length)]};
    pieceInfo.textContent='长度 '+len+' · 方向 '+['↔','↘','↙'][piece.dir];
    drawPreview();
  }
  function sync(){ elScore.textContent=score; elBest.textContent=best; elCombo.textContent=combo; }
  function reset(){ initBoard(); score=0; combo=0; particles=[]; floaters=[]; state='play'; over.classList.add('hidden'); gen(); sync(); }
  function burst(x,y,n,color){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=40+Math.random()*140; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:2+Math.random()*4}); } }
  function floater(text,x,y,color){ floaters.push({text,x,y,life:1,color}); }
  function place(){
    if(state!=='play'||!valid(piece.q,piece.r,piece.dir,piece.len)){
      if(state==='play'){ beep(150,0.09,'square',0.08); } return;
    }
    ensureAudio();
    const cs=cells(piece);
    for(const [q,r] of cs){ const c=board.get(key(q,r)); c.c=piece.color; c.flash=0; }
    beep(380+piece.len*70,0.07,'triangle',0.1);
    const cleared=lines.filter(line=>line.every(c=>c.c!==null));
    if(cleared.length){
      combo++;
      let count=0;
      for(const line of cleared) for(const c of line){
        const p=cellPos(c.q,c.r); c.c=null; c.flash=1; count++;
        burst(p.x,p.y,4,line[0].c||piece.color);
      }
      const pts=count*10*combo; score+=pts;
      const first=cellPos(cleared[0][0].q,cleared[0][0].r);
      floater('+'+pts+(combo>1?' ×'+combo:''),first.x,first.y-20,'#ffd166');
      beep(520+Math.min(combo,8)*80,0.18,'sine',0.14,900+Math.min(combo,8)*90);
    } else combo=0;
    sync();
    let placeable=false;
    for(const c of board.values()){
      for(let d=0;d<3;d++){ if(valid(c.q,c.r,d,piece.len)){ placeable=true; break; } }
      if(placeable) break;
    }
    if(!placeable){ end(); return; }
    gen();
  }
  function end(){
    state='over'; beep(220,0.5,'sawtooth',0.16,60);
    if(score>best){ best=score; localStorage.setItem('hexPuzzleBest',best); elRecord.textContent='🏆 新纪录！'; }
    else elRecord.textContent='最高分 '+best;
    elFinal.textContent=score; combo=0; sync();
    setTimeout(()=>over.classList.remove('hidden'),350);
  }
  function rotate(){ if(state!=='play') return; piece.dir=(piece.dir+1)%3; pieceInfo.textContent='长度 '+piece.len+' · 方向 '+['↔','↘','↙'][piece.dir]; drawPreview(); beep(460,0.05,'sine',0.07); }
  function hexPath(c,x,y,s){
    c.beginPath();
    for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-90); const px=x+s*Math.cos(a),py=y+s*Math.sin(a); if(i) c.lineTo(px,py); else c.moveTo(px,py); }
    c.closePath();
  }
  function drawPreview(){
    if(!piece) return;
    pctx.clearRect(0,0,prev.width,prev.height);
    const s=24, pts=cells({q:0,r:0,dir:piece.dir,len:piece.len});
    const xs=pts.map(p=>SQ3*s*p[0]+SQ3*s*p[1]/2), ys=pts.map(p=>1.5*s*p[1]);
    const mx=(Math.min(...xs)+Math.max(...xs))/2, my=(Math.min(...ys)+Math.max(...ys))/2;
    for(const [dq,dr] of pts){
      const x=prev.width/2+SQ3*s*(dq+dr/2)-mx, y=prev.height/2+1.5*s*dr-my;
      hexPath(pctx,x,y,s-2); pctx.fillStyle=piece.color; pctx.fill();
      pctx.strokeStyle='rgba(255,255,255,.4)'; pctx.lineWidth=1.5; pctx.stroke();
    }
  }
  function render(){
    ctx.clearRect(0,0,W,H);
    for(const cell of board.values()){
      const p=cellPos(cell.q,cell.r);
      hexPath(ctx,p.x,p.y,S-1.5);
      if(cell.c){
        ctx.fillStyle=cell.c; ctx.fill();
        const g=ctx.createLinearGradient(0,p.y-S,0,p.y+S);
        g.addColorStop(0,'rgba(255,255,255,.22)'); g.addColorStop(1,'rgba(0,0,0,.22)');
        ctx.fillStyle=g; ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.28)';
      } else {
        ctx.fillStyle='#16203a'; ctx.fill();
        ctx.strokeStyle='rgba(122,162,255,.12)';
      }
      ctx.lineWidth=1; ctx.stroke();
      if(cell.flash>0){ ctx.globalAlpha=cell.flash; hexPath(ctx,p.x,p.y,S-1.5); ctx.fillStyle='#fff'; ctx.fill(); ctx.globalAlpha=1; }
    }
    if(state==='play'){
      const ok=valid(piece.q,piece.r,piece.dir,piece.len);
      ctx.globalAlpha=ok?0.55:0.3;
      ctx.fillStyle=ok?piece.color:'#ff6b81';
      ctx.strokeStyle=ok?'#fff':'#ff9aa8'; ctx.lineWidth=2;
      for(const [q,r] of cells(piece)){
        if(!inBoard(q,r)) continue;
        const p=cellPos(q,r); hexPath(ctx,p.x,p.y,S-3); ctx.fill(); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    for(const f of floaters){ ctx.globalAlpha=Math.max(0,f.life); ctx.fillStyle=f.color; ctx.font='900 19px system-ui'; ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.strokeText(f.text,f.x,f.y); ctx.fillText(f.text,f.x,f.y); }
    ctx.globalAlpha=1;
  }
  function update(dt){
    for(const c of board.values()) c.flash=Math.max(0,c.flash-dt*2.6);
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.life-=dt*1.6; }
    particles=particles.filter(p=>p.life>0);
    for(const f of floaters){ f.y-=34*dt; f.life-=dt*1.15; }
    floaters=floaters.filter(f=>f.life>0);
  }
  function loop(t){ const dt=Math.min(0.033,(t-last)/1000||0); last=t; update(dt); render(); requestAnimationFrame(loop); }
  function pointerCell(e){ const r=cv.getBoundingClientRect(); return toAxial((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height); }
  cv.addEventListener('pointermove',e=>{ if(state!=='play') return; const p=pointerCell(e); piece.q=p.q; piece.r=p.r; });
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); if(state!=='play') return; const p=pointerCell(e); piece.q=p.q; piece.r=p.r; place(); });
  window.addEventListener('keydown',e=>{
    if(e.key==='r'||e.key==='R'){ e.preventDefault(); rotate(); }
    if(e.code==='Space'){ e.preventDefault(); place(); }
  });
  document.getElementById('rot').onclick=rotate;
  document.getElementById('rotM').onclick=rotate;
  document.getElementById('restart').onclick=reset;
  document.getElementById('restartM').onclick=reset;
  document.getElementById('again').onclick=reset;
  reset(); requestAnimationFrame(loop);
})();
</script>
<!-- 应用模式：屏蔽浏览器原生交互（选中/拖拽/右键菜单/双击缩放） -->
<script>
(function(){
  var EDITABLE='input,textarea,select,[contenteditable]';
  ['selectstart','dragstart'].forEach(function(type){ document.addEventListener(type,function(e){ if(e.target&&e.target.closest&&e.target.closest(EDITABLE))return; e.preventDefault(); }); });
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  ['gesturestart','gesturechange','gestureend'].forEach(function(type){ document.addEventListener(type,function(e){ e.preventDefault(); },{passive:false}); });
  window.addEventListener('wheel',function(e){ if(e.ctrlKey||e.metaKey)e.preventDefault(); },{passive:false});
  window.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>=0)e.preventDefault(); });
})();
</script>
</body>
</html>
