<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <link rel="icon" href="data:,">
  <title>星海漂流</title>
  <style>
    :root {
      --ink: #f4ecdf;
      --ink-dim: rgba(244, 236, 223, .55);
      --line: rgba(255, 255, 255, .16);
      --glass: rgba(10, 14, 28, .38);
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #05060f;
      color: var(--ink);
      font-family: "Inter", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    #stage canvas.is-dragging { cursor: grabbing; }
    #stage canvas.can-pick { cursor: pointer; }

    /* ---------- brand ---------- */
    .brand {
      position: fixed;
      left: max(26px, env(safe-area-inset-left));
      top: max(24px, env(safe-area-inset-top));
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      animation: rise 1.6s var(--ease) .55s forwards;
    }
    .brand h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
      font-size: clamp(19px, 2.1vw, 27px);
      font-weight: 500;
      letter-spacing: .34em;
      text-indent: .34em;
      text-shadow: 0 2px 22px rgba(0, 0, 0, .45);
    }
    .brand p {
      margin: 9px 0 0;
      font-size: 9px;
      letter-spacing: .62em;
      text-indent: .62em;
      color: var(--ink-dim);
    }

    /* ---------- bottom ---------- */
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(22px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 0 max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left));
      pointer-events: none;
      opacity: 0;
      animation: rise 1.8s var(--ease) 1.1s forwards;
    }

    .hint {
      margin: 0;
      font-size: 11px;
      letter-spacing: .24em;
      text-indent: .24em;
      color: var(--ink-dim);
      text-align: center;
      transition: opacity 1.4s var(--ease);
      text-shadow: 0 1px 12px rgba(0, 0, 0, .5);
    }
    .hint.gone { opacity: 0; }

    .bar {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1vw, 14px);
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
      pointer-events: auto;
    }

    .scenes { display: flex; align-items: center; gap: 2px; }

    button {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .scene {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      height: 38px;
      padding: 0 15px;
      border-radius: 999px;
      color: rgba(244, 236, 223, .52);
      font-size: 11px;
      letter-spacing: .2em;
      text-indent: .2em;
      white-space: nowrap;
      transition: color .5s var(--ease), background .5s var(--ease);
    }
    .scene .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      border: 1px solid currentColor;
      transition: all .5s var(--ease);
    }
    .scene:hover { color: rgba(244, 236, 223, .85); }
    .scene[aria-pressed="true"] {
      color: var(--ink);
      background: rgba(255, 255, 255, .075);
    }
    .scene[aria-pressed="true"] .dot {
      background: currentColor;
      box-shadow: 0 0 10px currentColor, 0 0 22px currentColor;
      transform: scale(1.15);
    }

    .divider {
      width: 1px;
      height: 22px;
      margin: 0 4px;
      background: var(--line);
    }

    .tools { display: flex; align-items: center; gap: 4px; }

    .icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: rgba(244, 236, 223, .6);
      transition: color .3s var(--ease), background .3s var(--ease);
    }
    .icon:hover { color: var(--ink); background: rgba(255, 255, 255, .07); }
    .icon svg { width: 16px; height: 16px; }
    .icon[aria-pressed="false"] { color: rgba(244, 236, 223, .3); }
    .icon[aria-pressed="false"] .waves { opacity: 0; }
    .icon[aria-pressed="false"] .mute { opacity: 1; }
    .icon .mute { opacity: 0; transition: opacity .3s; }

    button:focus-visible {
      outline: 1px solid rgba(255, 255, 255, .7);
      outline-offset: 2px;
    }

    /* ---------- loader ---------- */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #05060f;
      transition: opacity 1.1s var(--ease), visibility 1.1s;
    }
    #loader.done { opacity: 0; visibility: hidden; }
    .loader-inner { text-align: center; }
    .loader-inner .ring {
      width: 34px;
      height: 34px;
      margin: 0 auto 22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .12);
      border-top-color: rgba(232, 220, 255, .75);
      animation: spin 2.4s linear infinite;
    }
    .loader-inner p {
      margin: 0;
      font-size: 10px;
      letter-spacing: .42em;
      text-indent: .42em;
      color: var(--ink-dim);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { to { opacity: 1; transform: none; } }

    @media (max-width: 560px) {
      .brand { left: max(18px, env(safe-area-inset-left)); top: max(18px, env(safe-area-inset-top)); }
      .brand h1 { font-size: 17px; letter-spacing: .26em; text-indent: .26em; }
      .brand p { letter-spacing: .48em; text-indent: .48em; }
      .bar { gap: 2px; padding: 5px; }
      .scene { padding: 0 11px; font-size: 10px; letter-spacing: .12em; text-indent: .12em; height: 36px; }
      .scene .dot { width: 4px; height: 4px; }
      .divider { margin: 0 1px; height: 18px; }
      .icon { width: 36px; height: 36px; }
      .hint { font-size: 10px; letter-spacing: .14em; text-indent: .14em; max-width: 78vw; line-height: 1.9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand, .dock { animation-duration: .01s; animation-delay: 0s; }
      .loader-inner .ring { animation-duration: 8s; }
    }
  </style>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>

  <header class="brand">
    <h1>星海漂流</h1>
    <p>STAR DRIFT</p>
  </header>

  <div class="dock">
    <p class="hint" id="hint" role="status">拖动 · 拨动航向　·　点击星辰 · 让它绽放</p>
    <div class="bar" role="group" aria-label="场景与声音">
      <nav class="scenes" id="scenes" aria-label="氛围场景">
        <button class="scene" data-scene="0" aria-pressed="true"><i class="dot"></i>蓝色深空</button>
        <button class="scene" data-scene="1" aria-pressed="false"><i class="dot"></i>粉紫星云</button>
        <button class="scene" data-scene="2" aria-pressed="false"><i class="dot"></i>晨光海面</button>
      </nav>
      <span class="divider" aria-hidden="true"></span>
      <div class="tools">
        <button class="icon" id="sound" aria-pressed="true" aria-label="声音" title="声音">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9.5v5h3l4.2 3.2V6.3L7 9.5H4z" fill="currentColor" stroke="none"/>
            <g class="waves"><path d="M15.6 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M18.2 6.2a8.2 8.2 0 0 1 0 11.6"/></g>
            <path class="mute" d="M15.5 10l4.5 4m0-4l-4.5 4" stroke-width="1.5"/>
          </svg>
        </button>
        <button class="icon" id="capture" aria-pressed="true" aria-label="保存画面" title="保存画面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 8.5h3l1.3-2h6.4l1.3 2h3v10h-15z"/>
            <circle cx="12" cy="13.4" r="3.2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="loader">
    <div class="loader-inner">
      <div class="ring"></div>
      <p>正在铺开星海</p>
    </div>
  </div>
