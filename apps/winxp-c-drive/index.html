<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#245edb">
<title>Windows XP · C盘考古</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:Tahoma,"Microsoft YaHei",SimSun,sans-serif;font-size:12px;color:#000;user-select:none;-webkit-user-select:none;background:#000}
button,input{font-family:inherit;font-size:inherit}
#desktop{position:fixed;left:0;right:0;top:0;bottom:40px;overflow:hidden}
.wallpaper{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.desk-icons{position:absolute;top:14px;left:12px;display:flex;flex-direction:column;gap:10px;z-index:1}
.dicon{width:78px;text-align:center;color:#fff;cursor:default;text-shadow:0 1px 2px #000,0 0 3px rgba(0,0,0,.8)}
.dicon .ic{width:42px;height:42px;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.45))}
.dicon .ic svg{width:42px;height:42px}
.dicon .lb{padding:2px 3px;border:1px solid transparent;font-size:12px;line-height:1.2;display:inline-block}
.dicon.sel .lb{background:#124db8;border:1px dotted #bcd8ff}

/* ---------- windows ---------- */
.win{position:absolute;background:#ece9d8;border:1px solid #0054e3;border-radius:8px 8px 3px 3px;box-shadow:2px 4px 14px rgba(0,0,0,.38);display:flex;flex-direction:column;min-width:240px;min-height:150px;overflow:hidden;z-index:100}
.win.inactive{border-color:#8294ad;box-shadow:1px 2px 8px rgba(0,0,0,.28)}
.win.minimized{display:none}
.title-bar{height:29px;flex-shrink:0;background:linear-gradient(to bottom,#0a5ce6 0%,#3f93ea 8%,#2b7fe0 48%,#1e6fd0 90%,#1558b8 100%);border-radius:7px 7px 0 0;display:flex;align-items:center;padding:0 4px 0 7px;color:#fff;cursor:default}
.win.inactive .title-bar{background:linear-gradient(to bottom,#9ab5d4,#7693bd)}
.title-bar .ti{font-weight:bold;font-size:12px;text-shadow:1px 1px 1px rgba(0,0,0,.45);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.title-bar .ti svg{width:16px;height:16px;flex-shrink:0}
.win-btns{display:flex;gap:3px}
.wbtn{width:21px;height:21px;border:1px solid #fff;border-radius:4px;background:linear-gradient(to bottom,#5aa4ff,#1b5fd0);color:#fff;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;text-shadow:0 1px 1px #000;font-weight:bold}
.wbtn.close{background:linear-gradient(to bottom,#ff9c80,#e03b1e)}
.wbtn:active{filter:brightness(.78)}
.menu-bar{height:23px;flex-shrink:0;background:#faf9f4;border-bottom:1px solid #d6d2c4;display:flex;align-items:center;padding:0 6px;gap:15px;font-size:12px}
.menu-bar span{cursor:default}
.menu-bar span:hover{color:#0057d8}
.tool-bar{height:37px;flex-shrink:0;background:linear-gradient(to bottom,#fdfcf7,#e7e4d9);border-bottom:1px solid #cfcbbb;display:flex;align-items:center;gap:4px;padding:0 6px}
.tb-btn{height:26px;min-width:26px;padding:0 5px;border:1px solid transparent;border-radius:3px;background:transparent;display:flex;align-items:center;gap:4px;cursor:pointer;color:#333}
.tb-btn:hover{border-color:#a8c4ee;background:linear-gradient(to bottom,#fff,#dce9ff)}
.tb-btn:active{background:#c5daf7}
.tb-btn:disabled{opacity:.35;cursor:default}
.tb-btn svg{width:20px;height:20px}
.tb-sep{width:1px;height:22px;background:#c9c5b7;margin:0 3px}
.addr-bar{height:26px;flex-shrink:0;background:#fff;border-top:1px solid #fff;border-bottom:1px solid #d6d2c4;display:flex;align-items:center;gap:6px;padding:0 6px}
.addr-bar .lbl{color:#666}
.addr-field{flex:1;height:20px;background:#fff;border:1px solid #7f9db9;display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;font-size:12px}
.win-body{flex:1;overflow:auto;background:#fff;position:relative;min-height:0}
.status-bar{height:22px;flex-shrink:0;background:#ece9d8;border-top:1px solid #fff;display:flex;align-items:center;gap:3px;padding:0 3px;font-size:11px;color:#333}
.status-cell{padding:2px 7px;border:1px solid #fff;min-width:70px;background:#f7f5ec}
.status-cell.grow{flex:1}
.status-cell button{border:0;background:transparent;color:#0057d8;cursor:pointer;padding:0;margin-right:16px;text-decoration:underline;font-size:11px}
.files{display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;padding:10px 8px;min-height:100%}
.file{width:86px;min-height:82px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default;border:1px solid transparent;border-radius:2px}
.file:hover{background:#edf3ff}
.file.sel{background:#cfe0ff;border:1px dotted #3465c0}
.file .ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.file .ic svg{width:38px;height:38px}
.file .nm{font-size:12px;text-align:center;line-height:1.25;word-break:break-all;max-height:33px;overflow:hidden}
.file.locked .nm{color:#8a5a00}
.info-pane{padding:10px 14px;line-height:1.9;color:#444}
.info-pane b{color:#154bbb}
.empty{padding:30px;text-align:center;color:#888}

/* notepad */
.win.notepad .win-body{background:#fff;font-family:"Courier New","SimSun",monospace}
.typed{white-space:pre-wrap;word-break:break-all;padding:10px 14px 30px;font-size:14px;line-height:1.75;color:#111;min-height:100%}
.tline{min-height:1.75em}
.caret{display:inline-block;width:7px;height:14px;background:#222;vertical-align:-2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* minesweeper */
.win.mines .win-body{background:#c0c0c0;padding:6px}
.mine-panel{border:3px solid #fff;border-right-color:#7b7b7b;border-bottom-color:#7b7b7b;background:#c0c0c0;padding:5px;display:inline-block}
.mine-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;border:2px solid #7b7b7b;border-right-color:#fff;border-bottom-color:#fff;padding:2px 4px}
.digital{font-family:"Courier New",monospace;font-weight:bold;font-size:20px;color:#f00;background:#000;padding:0 3px;letter-spacing:2px;text-shadow:0 0 4px #f00}
.smiley{width:28px;height:28px;border:2px solid #fff;border-right-color:#7b7b7b;border-bottom-color:#7b7b7b;font-size:16px;line-height:1;cursor:pointer;background:#c0c0c0;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(9,22px);gap:0;border:2px solid #7b7b7b;border-right-color:#fff;border-bottom-color:#fff}
.cell{width:22px;height:22px;border:2px solid #fff;border-right-color:#7b7b7b;border-bottom-color:#7b7b7b;background:#c0c0c0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;cursor:pointer;font-family:Tahoma}
.cell.rev{border:1px solid #808080;font-size:13px}
.cell.boom{background:#f00;color:#000}
.cell.flag{color:#e00}

/* ---------- taskbar ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:40px;background:linear-gradient(to bottom,#3f8ef0 0%,#245edb 14%,#1a4fc4 100%);border-top:1px solid #8bc0ff;display:flex;align-items:center;gap:4px;padding:2px 4px;z-index:9000;box-shadow:0 -1px 4px rgba(0,0,0,.2)}
.start-btn{height:32px;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;border-radius:0 10px 10px 0;background:linear-gradient(to bottom,#7bcb0c,#4a9b06);border:1px solid #2f6b00;color:#fff;font-weight:bold;font-size:15px;cursor:pointer;text-shadow:1px 1px 1px rgba(0,0,0,.45);flex-shrink:0}
.start-btn.open{background:linear-gradient(to bottom,#4a9b06,#2f6b00)}
.start-btn .flag{width:18px;height:18px}
.quick{display:flex;gap:2px;padding-left:7px;border-left:1px solid rgba(255,255,255,.35);flex-shrink:0}
.qbtn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:3px;cursor:pointer;background:transparent}
.qbtn:hover{border-color:#a8c8ff;background:rgba(255,255,255,.18)}
.qbtn svg{width:18px;height:18px}
.tasks{flex:1;display:flex;gap:3px;overflow:hidden;padding-left:7px;min-width:0}
.task-btn{height:30px;max-width:165px;min-width:80px;background:linear-gradient(to bottom:#5aa0ff,#2b6fd8);border:1px solid #1c4fa8;border-radius:3px;color:#fff;display:flex;align-items:center;gap:5px;padding:0 8px;cursor:pointer;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex-shrink:1}
.task-btn.active{background:linear-gradient(to bottom,#2b5db8,#17429a);box-shadow:inset 1px 1px 3px rgba(0,0,0,.45)}
.task-btn svg{width:16px;height:16px;flex-shrink:0}
.tray{height:30px;min-width:118px;background:linear-gradient(to bottom,#45a8f8,#1d6fd0);border:1px solid #164e9e;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:0 9px;color:#fff;font-size:12px;flex-shrink:0;cursor:default}
.tray .ti{width:16px;height:16px}
.tray .vol{cursor:pointer}

/* ---------- start menu ---------- */
#startMenu{position:fixed;left:0;bottom:40px;width:390px;background:#fff;border:2px solid #1451b8;border-radius:8px 8px 0 0;z-index:9500;display:none;flex-direction:column;box-shadow:3px -3px 14px rgba(0,0,0,.4);overflow:hidden}
#startMenu.show{display:flex}
.sm-head{height:60px;flex-shrink:0;background:linear-gradient(to bottom,#2c5fd0,#1a4bb0);display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff;border-bottom:2px solid #103985}
.sm-avatar{width:40px;height:40px;border:2px solid #fff;border-radius:5px;background:linear-gradient(135deg,#ffd75e,#f08c2a);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sm-user{font-size:15px;font-weight:bold;text-shadow:1px 1px 2px rgba(0,0,0,.5)}
.sm-body{display:flex;min-height:300px}
.sm-left{width:152px;flex-shrink:0;background:linear-gradient(to bottom,#4a92ef 0%,#2a68cf 22%,#1c56bd 100%);padding:9px 0 9px 0;display:flex;flex-direction:column}
.sm-banner{flex:1;display:flex;align-items:flex-end;padding:0 0 8px 14px;pointer-events:none}
.sm-banner b{font-size:22px;color:rgba(255,255,255,.92);text-shadow:2px 2px 1px rgba(0,0,0,.35);letter-spacing:1px}
.sm-item{height:34px;display:flex;align-items:center;gap:8px;padding:0 13px;color:#fff;font-size:14px;cursor:pointer;text-shadow:1px 1px 1px rgba(0,0,0,.35)}
.sm-item:hover{background:#1652bd}
.sm-item svg{width:20px;height:20px;flex-shrink:0}
.sm-right{flex:1;background:#fff;padding:8px 7px;display:flex;flex-direction:column;gap:1px;min-width:0}
.sm-sep{height:1px;background:#d9d9d9;margin:5px 4px}
.sm-right .r{height:34px;display:flex;align-items:center;gap:10px;padding:0 9px;cursor:pointer;border-radius:3px;font-size:12px}
.sm-right .r:hover{background:#deebff}
.sm-right .r svg{width:22px;height:22px;flex-shrink:0}
.sm-right .r .arrow{margin-left:auto;color:#888}
.sm-foot{height:36px;flex-shrink:0;background:#d3e5ff;border-top:1px solid #a8c6ef;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 12px}
.sm-foot span{display:flex;align-items:center;gap:5px;cursor:pointer;color:#234}
.sm-foot span:hover{color:#0057d8}
.sm-foot svg{width:16px;height:16px}

/* ---------- context menu ---------- */
#contextMenu{position:fixed;z-index:9800;background:#fff;border:1px solid #7f9db9;box-shadow:2px 3px 9px rgba(0,0,0,.3);padding:3px;display:none;min-width:142px}
#contextMenu.show{display:block}
.cm-item{padding:6px 22px;cursor:pointer;font-size:12px;white-space:nowrap}
.cm-item:hover{background:#316ac5;color:#fff}
.cm-sep{height:1px;background:#ddd;margin:3px 5px}

/* ---------- clippy ---------- */
#clippy{position:fixed;right:8px;bottom:46px;z-index:8000;display:flex;align-items:flex-end;gap:6px;flex-direction:row-reverse;pointer-events:none;max-width:calc(100vw - 12px)}
.clip-body{width:38px;height:54px;flex-shrink:0;margin-bottom:2px;pointer-events:auto;cursor:pointer;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.4))}
.clip-body svg{width:100%;height:100%;display:block}
.clip-body.talk{animation:hop .4s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px) rotate(-4deg)}70%{transform:translateY(-2px) rotate(2deg)}}
.speech{max-width:min(210px,calc(100vw - 62px));background:#fffbe6;border:2px solid #d4a017;border-radius:8px;padding:7px 9px;box-shadow:2px 3px 9px rgba(0,0,0,.3);font-size:11px;line-height:1.5;display:none;position:relative;color:#4a3a10;overflow-wrap:anywhere}
.speech.show{display:block}
.speech:after{content:"";position:absolute;right:-8px;bottom:7px;border:7px solid transparent;border-left-color:#d4a017}
.speech:before{content:"";position:absolute;right:-5px;bottom:8px;border:6px solid transparent;border-left-color:#fffbe6;z-index:1}

/* ---------- screensaver ---------- */
#ss{position:fixed;inset:0;background:#000;z-index:9900;display:none;overflow:hidden;cursor:none}
#ss.show{display:block}
.sslogo{position:absolute;width:230px;text-align:center;color:#fff;will-change:transform;pointer-events:none}
.ssflag{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:74px;height:74px;margin:0 auto 10px;transform:skewY(-8deg);filter:drop-shadow(2px 3px 4px rgba(0,0,0,.8))}
.ssflag i{display:block}
.ssflag i:nth-child(1){background:#f25022}.ssflag i:nth-child(2){background:#7fba00}.ssflag i:nth-child(3){background:#00a4ef}.ssflag i:nth-child(4){background:#ffb900}
.sstext{font-size:30px;font-weight:bold;letter-spacing:1px;text-shadow:2px 3px 3px rgba(0,0,0,.9)}
.sstext small{font-size:13px;font-weight:normal;display:block;opacity:.85;letter-spacing:3px;margin-top:2px}

/* ---------- modal ---------- */
#modalLayer{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:9600;display:none;align-items:center;justify-content:center;padding:20px}
#modalLayer.show{display:flex}
.modal{background:#ece9d8;border:1px solid #0054e3;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.55);min-width:min(440px,94vw);max-width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal .title-bar{height:34px;border-radius:6px 6px 0 0;font-size:13px}
.modal-content{padding:24px 28px;background:#f7f5ee;overflow:auto;flex:1;font-size:13px;line-height:1.9}
.modal-btns{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 22px;background:#f7f5ee;flex-shrink:0}
.xbtn{min-width:88px;height:32px;padding:0 18px;border:1px solid #7f9db9;border-radius:3px;background:linear-gradient(to bottom,#fff,#e2e6ec);cursor:pointer;font-size:13px}
.xbtn:hover{background:linear-gradient(to bottom,#fff,#d3e5ff)}
.xbtn.primary{border-color:#1c4fa8;background:linear-gradient(to bottom,#6aa8ff,#2b6fd8);color:#fff}
.modal input[type=text]{width:100%;height:32px;border:1px solid #7f9db9;padding:0 10px;background:#fff;outline:none;font-size:13px}
.modal-content .info-pane{padding:2px 0;line-height:2;font-size:13px}
.report-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
#reportCanvas{width:320px;height:427px;max-width:100%;box-shadow:0 5px 18px rgba(0,0,0,.45);border:1px solid #b9a986;cursor:pointer}
.report-tip{font-size:12px;color:#665;line-height:1.7;text-align:center}
.report-actions{display:flex;gap:10px;justify-content:center;padding-bottom:4px}

.win-grip{position:absolute;right:0;bottom:0;width:16px;height:16px;z-index:6;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 42%,#b9b9b9 42%,#b9b9b9 50%,transparent 50%,transparent 64%,#b9b9b9 64%,#b9b9b9 72%,transparent 72%,transparent 86%,#b9b9b9 86%,#b9b9b9 94%,transparent 94%)}

/* ---------- responsive ---------- */
@media (max-width:760px) and (pointer:fine){
  .quick{display:none}
  .tray{min-width:100px;padding:0 6px}
  .task-btn{min-width:38px;max-width:110px;padding:0 6px}
  .start-btn{font-size:13px;padding:0 8px}
  #startMenu{width:min(390px,100vw)}
}
body.phone #desktop{bottom:46px}
body.phone #taskbar{height:46px;padding:2px 3px}
body.phone .start-btn{font-size:13px;padding:0 8px}
body.phone .start-btn .flag{width:16px;height:16px}
body.phone .quick{display:none}
body.phone .tray{min-width:92px;padding:0 6px;gap:6px;font-size:11px}
body.phone .tasks{padding-left:3px}
body.phone .task-btn{min-width:34px;width:38px;padding:0;justify-content:center;font-size:0}
body.phone .task-btn svg{width:18px;height:18px}
body.phone .win{position:fixed!important;left:0!important;top:0!important;width:100%!important;height:calc(100% - 46px)!important;border-radius:0;border:0;box-shadow:none;min-width:0;min-height:0}
body.phone .win-grip{display:none}
body.phone .title-bar{border-radius:0;height:34px}
body.phone .menu-bar{overflow-x:auto;white-space:nowrap}
body.phone .files{padding:8px 4px;gap:2px}
body.phone .file{width:76px}
body.phone #startMenu{width:100%;bottom:46px;border-radius:10px 10px 0 0}
body.phone .sm-body{min-height:270px}
body.phone #clippy{right:6px;bottom:52px}
body.phone .clip-body{width:32px;height:46px}
body.phone .speech{max-width:min(165px,calc(100vw - 54px));font-size:10.5px;padding:6px 8px}
body.phone .sm-foot span{font-size:11px}

/* ================= 仿真应用界面 ================= */
.ie-win .win-body{background:#fff}
.qz{min-height:100%;background:#eef3fa;color:#333;font-family:SimSun,"Microsoft YaHei",serif;font-size:12px;padding:8px}
.qz-banner{height:66px;border:2px ridge #9cc;background:linear-gradient(115deg,#ffd9ec,#d9e9ff 45%,#d9ffd9);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#d2378b;text-shadow:1px 1px 0 #fff;letter-spacing:2px}
.qz-marquee{margin-top:5px;border:1px dashed #f9a;background:#fff6fa;color:#d2378b;padding:3px;overflow:hidden;white-space:nowrap}
.qz-nav{display:flex;gap:4px;margin:6px 0}
.qz-nav span{padding:3px 12px;background:#fff;border:1px solid #a9c4e8;color:#1461b8;cursor:default}
.qz-nav span:hover{background:#d8e9ff}
.qz-main{display:flex;gap:8px}
.qz-left{flex:1;min-width:0}
.qz-right{width:132px;flex-shrink:0}
.qz-box{border:1px solid #b8cbe4;background:#fff;margin-bottom:7px}
.qz-box h4{margin:0;padding:4px 7px;background:linear-gradient(to right,#6a9fd8,#a8cdf2);color:#fff;font-size:12px}
.qz-box .bd{padding:7px}
.qz-log{border-bottom:1px dotted #ccd;padding:4px 0}
.qz-log b{color:#1461b8}
.qz-log .tm{color:#999;font-size:11px;float:right}
.qz-msg{border-bottom:1px dotted #ddd;padding:4px 0;line-height:1.5}
.qz-msg b{color:#d2378b}
.qz-msg .tm{color:#999;font-size:11px}
.qz-form{display:flex;gap:5px;margin-top:6px}
.qz-form input{flex:1;min-width:0;height:23px;border:1px solid #8fb0d8;padding:0 5px;font-size:12px}
.qz-form button{height:23px;border:1px solid #5c8bc7;background:linear-gradient(#fff,#dbe9ff);cursor:pointer;font-size:12px;padding:0 8px}
.qz-counter{font-family:"Courier New",monospace;background:#000;color:#0f0;text-align:center;font-size:16px;letter-spacing:3px;padding:2px}
.qz-badge{margin-top:8px;font-family:Tahoma;font-size:10px;color:#668;text-align:center}
.qz-hint{color:#d2378b;font-weight:bold;margin:4px 0}

.wizard .win-body{background:#ece9d8}
.wz{display:flex;min-height:100%;font-size:12px}
.wz-side{width:110px;flex-shrink:0;background:linear-gradient(to bottom,#3f8ee0,#1c56bd);color:#fff;padding:14px 10px;display:flex;align-items:flex-start}
.wz-side b{writing-mode:vertical-rl;font-size:18px;letter-spacing:4px;opacity:.9}
.wz-main{flex:1;display:flex;flex-direction:column;min-width:0}
.wz-body{flex:1;padding:14px 16px;background:#fff;margin:10px;border:1px solid #a7b8cc;min-height:0;overflow:auto}
.wz-body h3{margin:0 0 10px;font-size:15px;color:#154bbb}
.wz-body p{line-height:1.8;margin:6px 0}
.wz-license{height:96px;overflow:auto;border:1px inset #ddd;background:#fafafa;padding:7px;color:#555;font-size:11px;line-height:1.6}

const contentCache={};
function getContent(file){
  if(contentCache[file.id])return contentCache[file.id];
  let lines;
  if(STORY[file.id])lines=STORY[file.id].slice();
  else switch(file.genre){
    case 'chat':lines=genChat();break;
    case 'blog':lines=genBlog();break;
    case 'readme':lines=genReadme(file);break;
    case 'xunlei':lines=genXunlei();break;
    case 'music':lines=genMusic();break;
    case 'audition':lines=genDance();break;
    case 'lyrics':lines=genLyrics();break;
    case 'diary':lines=genDiary();break;
    case 'secret':lines=genSecret();break;
    case 'clue':lines=['','　　　　　　密码提示',''].concat(P.clue).concat(['','—— 回形针帮你记着呢']);break;
    default:lines=genNote();
  }
  lines=['='.repeat(30),'  '+file.name,'  创建时间：'+rnd(['2003','2005','2008','2009'])+'-'+pad(Math.floor(Math.random()*12)+1)+'-'+pad(Math.floor(Math.random()*28)+1)+'  '+pad(Math.floor(Math.random()*24))+':'+pad(Math.floor(Math.random()*60)),'='.repeat(30),''].concat(lines);
  contentCache[file.id]=lines;
  return lines;
}

let ac=null;
function ensureAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}if(ac&&ac.state==='suspended')ac.resume()}
function tone(freq,dur,type,vol,when,glide){
  if(!ac||state.muted)return;
  const t=when||ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+0.06);
}
function playBoot(){
  ensureAudio();if(!ac)return;
  const t=ac.currentTime;
  [261.63,329.63,392.0,523.25].forEach(function(f,i){tone(f,1.8-i*0.2,'sine',0.1,t+i*0.14)});
  tone(783.99,2.4,'sine',0.045,t+0.55);
  tone(130.81,2.2,'triangle',0.05,t);
}
function playPop(){ensureAudio();tone(880,0.09,'sine',0.09);tone(1320,0.14,'sine',0.07,ac?ac.currentTime+0.06:0)}
function playTick(){ensureAudio();tone(1200,0.03,'square',0.02)}
function playDisk(){
  ensureAudio();if(!ac||state.muted)return;
  const dur=0.22,sr=ac.sampleRate,buf=ac.createBuffer(1,Math.floor(sr*dur),sr),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const env=i<d.length*0.12?i/(d.length*0.12):(Math.random()<0.05?1:0.18);d[i]=(Math.random()*2-1)*env}
  const src=ac.createBufferSource();src.buffer=buf;
  const filt=ac.createBiquadFilter();filt.type='bandpass';filt.frequency.value=1600;filt.Q.value=1.1;
  const g=ac.createGain();g.gain.value=0.11;
  src.connect(filt).connect(g).connect(ac.destination);src.start();
}
function playError(){ensureAudio();tone(220,0.12,'square',0.07);tone(180,0.18,'square',0.06,ac?ac.currentTime+0.12:0)}

const winLayer=$('#windows'),tasksEl=$('#tasks'),wins={};
function taskIcon(icon){return ICONS[icon]||ICONS.txt}
function addTask(w){
  let b=document.createElement('button');b.className='task-btn';b.dataset.win=w.id;
  b.innerHTML=taskIcon(w.opt.icon)+'<span>'+w.title+'</span>';
  b.addEventListener('click',function(){if(w.min||!w.el.classList.contains('active'))restoreWin(w.id);else minimizeWin(w.id)});

}
function updateTaskActive(){
  $$('.task-btn').forEach(function(b){const w=wins[b.dataset.win];b.classList.toggle('active',!!w&&!w.min&&w.el.classList.contains('active'))});
}
function focusWin(id){
  const w=wins[id];if(!w)return;
  $$('.win').forEach(function(e){e.classList.remove('active');e.classList.add('inactive')});
  w.el.style.zIndex=++Z;w.el.classList.add('active');w.el.classList.remove('inactive');
  updateTaskActive();
}
function minimizeWin(id){const w=wins[id];if(!w)return;w.min=true;w.el.classList.add('minimized');w.el.classList.remove('active');updateTaskActive()}
function restoreWin(id){
  const w=wins[id];if(!w)return;w.min=false;w.el.classList.remove('minimized');focusWin(id);
}
function isPhoneUI(){
  if(/[?&]mobile=1/.test(location.search))return true;
  return matchMedia('(max-width:760px)').matches &&
         (matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints||0)>0);
}
function syncPhoneUI(){document.body.classList.toggle('phone',isPhoneUI())}
function taskbarH(){return isPhoneUI()?46:40}
function availW(){return Math.max(220,window.innerWidth-4)}
function availH(){return Math.max(150,window.innerHeight-taskbarH()-4)}
function clampV(v,min,max){return Math.min(Math.max(v,min),Math.max(min,max))}
function toggleMax(id){
  const w=wins[id];if(!w||isPhoneUI())return;
  if(w.max){
    w.el.style.cssText=w.prev;w.max=false;delete w.el.dataset.max;
  }else{
    w.prev=w.el.style.cssText;
    w.el.style.left='2px';w.el.style.top='2px';
    w.el.style.width=availW()+'px';w.el.style.height=availH()+'px';
    w.max=true;w.el.dataset.max='1';
  }
  focusWin(id);
}
function closeWin(id){
  const w=wins[id];if(!w)return;w.el.remove();delete wins[id];
  const b=$('.task-btn[data-win="'+id+'"]');if(b)b.remove();updateTaskActive();
}
function createWindow(opt){
  const id=opt.id||('w'+(++WN));
  if(wins[id]){restoreWin(id);focusWin(id);return id}
  let w=opt.width||560,h=opt.height||400;
  if(!isPhoneUI()){w=Math.min(w,availW());h=Math.min(h,availH())}
  const off=isPhoneUI()?0:(Object.keys(wins).length%6)*20;
  let left=opt.left!=null?opt.left:Math.round((window.innerWidth-w)/2)-50+off;
  let top=opt.top!=null?opt.top:Math.round((window.innerHeight-taskbarH()-h)/2)-40+off;
  if(!isPhoneUI()){
    left=clampV(left,2,Math.max(2,window.innerWidth-w-2));
    top=clampV(top,2,Math.max(2,window.innerHeight-taskbarH()-h-2));
  }else{left=0;top=0}
  const el=document.createElement('div');
  el.className='win'+(opt.bodyClass?' '+opt.bodyClass:'');
  el.style.cssText='left:'+left+'px;top:'+top+'px;width:'+w+'px;height:'+h+'px;z-index:'+(++Z);
  let menu='';if(opt.menu)menu='<div class="menu-bar">'+opt.menu.map(function(m){return '<span>'+m+'</span>'}).join('')+'</div>';
  el.innerHTML='<div class="title-bar"><div class="ti">'+(opt.icon||opt.icon==='' ?taskIcon(opt.icon):'')+'<span class="ttl">'+opt.title+'</span></div><div class="win-btns"><div class="wbtn" data-a="min">_</div><div class="wbtn" data-a="max">□</div><div class="wbtn close" data-a="close">×</div></div></div>'+menu+(opt.toolbar||'')+'<div class="win-body"></div>'+(opt.status||'')+'<div class="win-grip"></div>';
  winLayer.appendChild(el);
  const wobj={id:id,el:el,opt:opt,title:opt.title,min:false,max:false,prev:''};wins[id]=wobj;addTask(wobj);
  $$('.wbtn',el).forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();const a=b.dataset.a;if(a==='min')minimizeWin(id);else if(a==='max')toggleMax(id);else closeWin(id)})});
  el.addEventListener('pointerdown',function(){focusWin(id)},true);
  const bar=$('.title-bar',el);
  bar.addEventListener('dblclick',function(e){if(!e.target.closest('.wbtn'))toggleMax(id)});
  makeDraggable(el,bar);
  makeResizable(el,$('.win-grip',el));
  if(!opt.noSound){playPop();state.openedWindows++;save()}
  return id;

/* ================= DRAG / RESIZE ================= */
function makeDraggable(el,handle){
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  handle.addEventListener('pointerdown',function(e){
    if(e.target.closest('.wbtn'))return;
    if(isPhoneUI()||el.dataset.max==='1')return;
    dragging=true;sx=e.clientX;sy=e.clientY;
    ox=parseFloat(el.style.left)||0;oy=parseFloat(el.style.top)||0;
    handle.setPointerCapture(e.pointerId);e.preventDefault();
  });
  handle.addEventListener('pointermove',function(e){
    if(!dragging)return;
    const nx=clampV(ox+e.clientX-sx,0,Math.max(0,window.innerWidth-el.offsetWidth));
    const ny=clampV(oy+e.clientY-sy,0,Math.max(0,window.innerHeight-taskbarH()-el.offsetHeight));
    el.style.left=nx+'px';el.style.top=ny+'px';
  });
  handle.addEventListener('pointerup',function(){dragging=false});
  handle.addEventListener('pointercancel',function(){dragging=false});
}
function makeResizable(el,grip){
  if(!grip)return;
  let on=false,sx=0,sy=0,sw=0,sh=0;
  grip.addEventListener('pointerdown',function(e){
    if(isPhoneUI()||el.dataset.max==='1')return;
    on=true;sx=e.clientX;sy=e.clientY;sw=el.offsetWidth;sh=el.offsetHeight;
    grip.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();
  });
  grip.addEventListener('pointermove',function(e){
    if(!on)return;
    el.style.width=clampV(sw+e.clientX-sx,240,availW())+'px';
    el.style.height=clampV(sh+e.clientY-sy,150,availH())+'px';
  });
  grip.addEventListener('pointerup',function(){on=false});
  grip.addEventListener('pointercancel',function(){on=false});
}

function openExplorer(nodeId,fresh){

  const key=fresh?null:('exp_'+nodeId);

  if(existing){
    if(!w.history){w.history=[nodeId];w.hi=0}
    else if(w.node&&w.node.id!==nodeId){
      w.history=w.history.slice(0,w.hi+1);w.history.push(nodeId);w.hi++;
    }
  }else if(!w.history){w.history=[nodeId];w.hi=0}
  w.node=node;

function bindToolbar(w){
  if(w.bound)return;w.bound=true;

  $$('[data-tb]',el).forEach(function(b){
    b.addEventListener('click',function(){
      const a=b.dataset.tb;
      if(a==='back'&&w.hi>0){
        const t=w.history[w.hi-1];if(t){w.hi--;renderNode(w,t);playDisk()}
      }
      else if(a==='fwd'&&w.hi<w.history.length-1){
        const t=w.history[w.hi+1];if(t){w.hi++;renderNode(w,t);playDisk()}
      }
      else if(a==='up'){
        const p=parentMap[w.node.id];

      else if(a==='folder')say('文件按类型排列，隐藏文件夹通常在最后。',3000);

/* ================= MINESWEEPER ================= */
function openMines(){
  const id=createWindow({id:'mines',title:'扫雷',icon:'game',width:262,height:342,bodyClass:'mines'});
  const body=$('.win-body',wins[id].el);
  const cols=9,rows=9,MINES=10;
  let board=[],rev=0,flags=0,started=false,dead=false,won=false,sec=0,timer=null;
  function reset(){
    board=[];for(let y=0;y<rows;y++){const row=[];for(let x=0;x<cols;x++)row.push({mine:false,adj:0,rev:false,flag:false});board.push(row)}
    rev=0;flags=0;started=false;dead=false;won=false;sec=0;clearInterval(timer);timer=null;render();setFace('🙂');updateDigits();
  }
  function place(sx,sy){
    let placed=0;
    while(placed<MINES){
      const x=Math.floor(Math.random()*cols),y=Math.floor(Math.random()*rows);
      if(board[y][x].mine||(Math.abs(x-sx)<=1&&Math.abs(y-sy)<=1))continue;
      board[y][x].mine=true;placed++;
    }
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const ny=y+dy,nx=x+dx;if(ny>=0&&ny<rows&&nx>=0&&nx<cols&&board[ny][nx].mine)n++}
      board[y][x].adj=n;
    }
  }
  function reveal(x,y){
    if(dead||won)return;
    if(!started){place(x,y);started=true;timer=setInterval(function(){sec=Math.min(999,sec+1);updateDigits()},1000)}
    const c=board[y][x];if(c.rev||c.flag)return;
    if(c.mine){c.rev=true;dead=true;clearInterval(timer);setFace('😵');revealAll();say('踩雷了。扫雷的哲学是：别急着点。',3000);playError();render();return}
    flood(x,y);render();checkWin();
  }
  function flood(x,y){
    const c=board[y][x];if(c.rev||c.flag)return;
    c.rev=true;rev++;
    if(c.adj===0){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const ny=y+dy,nx=x+dx;if(ny>=0&&ny<rows&&nx>=0&&nx<cols&&!board[ny][nx].mine)flood(nx,ny)}}
  }
  function revealAll(){board.forEach(function(row){row.forEach(function(c){if(c.mine&&!c.flag)c.rev=true})})}
  function checkWin(){if(rev===rows*cols-MINES){won=true;clearInterval(timer);setFace('😎');say('扫雷通关！这手速，当年能进网吧战队。',3600);playBoot()}}
  function updateDigits(){
    const mineLeft=String(Math.max(0,MINES-flags)).padStart(3,'0'),t=String(sec).padStart(3,'0');
    $('#mLeft',body).textContent=mineLeft;$('#mTime',body).textContent=t;
  }
  function setFace(f){$('#smile',body).textContent=f}
  function render(){
    let g=$('#grid',body);
    if(!g){
      body.innerHTML='<div class="mine-panel"><div class="mine-top"><div class="digital" id="mLeft">010</div><div class="smiley" id="smile">🙂</div><div class="digital" id="mTime">000</div></div><div class="grid" id="grid"></div></div>';
      g=$('#grid',body);
      $('#smile',body).addEventListener('click',function(){reset();playPop()});
      g.addEventListener('contextmenu',function(e){e.preventDefault()});
    }
    g.innerHTML='';
    const colors=['','#0000ff','#008000','#ff0000','#000080','#800000','#008080','#000000','#808080'];
    board.forEach(function(row,y){row.forEach(function(c,x){
      const el=document.createElement('div');el.className='cell'+(c.rev?' rev':'')+(c.flag?' flag':'');
      if(c.rev){
        if(c.mine){el.textContent='💣';el.classList.add('boom')}
        else if(c.adj){el.textContent=c.adj;el.style.color=colors[c.adj]}
      }else if(c.flag)el.textContent='🚩';
      el.addEventListener('click',function(){reveal(x,y)});
      el.addEventListener('contextmenu',function(e){e.preventDefault();if(c.rev||dead||won)return;c.flag=!c.flag;flags+=c.flag?1:-1;render();updateDigits();playTick()});
      g.appendChild(el);
    })});
  }
  reset();
}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

  ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(140+i*160,110+Math.random()*40,90,22,0,0,7);ctx.fill()}
  ctx.fillStyle='#6fb038';ctx.beginPath();ctx.moveTo(60,230);ctx.quadraticCurveTo(250,160,470,215);ctx.quadraticCurveTo(700,265,840,200);ctx.lineTo(840,270);ctx.lineTo(60,270);ctx.fill();
  ctx.fillStyle='#3f8a24';ctx.beginPath();ctx.moveTo(60,250);ctx.quadraticCurveTo(300,210,520,245);ctx.quadraticCurveTo(720,275,840,240);ctx.lineTo(840,270);ctx.lineTo(60,270);ctx.fill();ctx.restore();
  ctx.strokeStyle='#6b542f';ctx.lineWidth=2;rr(ctx,60,60,W-120,210,10);ctx.stroke();

const ss=$('#ss'),sslogo=$('#sslogo');
let ssOn=false,lastAct=Date.now(),sx=80,sy=90,vx=2.6,vy=1.9,raf=null;
function showSS(){
  if(ssOn)return;ssOn=true;ss.classList.add('show');
  sx=Math.random()*(window.innerWidth-240);sy=Math.random()*(window.innerHeight-160);
  vx=(Math.random()>0.5?1:-1)*(1.8+Math.random()*2);vy=(Math.random()>0.5?1:-1)*(1.2+Math.random()*1.8);
  say('发呆中……屏幕保护程序启动了。',3000);

}
function loopSS(){
  if(!ssOn)return;
  sx+=vx;sy+=vy;
  if(sx<0){sx=0;vx*=-1}if(sx>window.innerWidth-230){sx=window.innerWidth-230;vx*=-1}
  if(sy<0){sy=0;vy*=-1}if(sy>window.innerHeight-170){sy=window.innerHeight-170;vy*=-1}
  sslogo.style.transform='translate('+sx+'px,'+sy+'px)';
  raf=requestAnimationFrame(loopSS);
}
function hideSS(){if(!ssOn)return;ssOn=false;ss.classList.remove('show');cancelAnimationFrame(raf)}
['pointermove','pointerdown','keydown','wheel','touchstart'].forEach(function(e){window.addEventListener(e,function(){lastAct=Date.now();hideSS()},{passive:true})});

    status:'<div class="status-bar"><div class="status-cell grow ie-status">完成</div><div class="status-cell">Internet</div></div>'});

function bindIE(w){
  const el=w.el;
  $$('[data-tb]',el).forEach(function(b){b.addEventListener('click',function(){
    const a=b.dataset.tb;
    if(a==='bback'&&w.bi>0){w.bi--;ieRender(w,w.bhistory[w.bi]);playDisk()}
    else if(a==='bfwd'&&w.bi<w.bhistory.length-1){w.bi++;ieRender(w,w.bhistory[w.bi]);playDisk()}
    else if(a==='bhome')ieGoto(w,'qzone');
    else if(a==='brefresh'){ieRender(w,w.bhistory[w.bi]);playDisk()}
    else if(a==='bgo')ieGoto(w,'baidu');
  })});
  $$('[data-site]',el).forEach(function(b){b.addEventListener('click',function(){
    const k=b.dataset.site;
    if(k==='secret'&&!state.webExplore.bonus){say('这个收藏夹是灰的……好像还没解锁。',3000);playError();return}
    ieGoto(w,k);
  })});
}
function ieGoto(w,site){
  if(!SITES[site])return;
  w.bhistory=w.bhistory.slice(0,w.bi+1);w.bhistory.push(site);w.bi++;
  ieRender(w,site);
}
function ieRender(w,site){
  const s=SITES[site];if(!s)return;
  w.site=site;
  w.el.querySelector('.ttl').textContent=s.title;
  $('.ie-addr',w.el).textContent=s.url;
  $$('[data-site]',w.el).forEach(function(b){b.classList.toggle('on',b.dataset.site===site)});
  const back=$('[data-tb="bback"]',w.el),fwd=$('[data-tb="bfwd"]',w.el);
  if(back)back.disabled=w.bi<=0;if(fwd)fwd.disabled=w.bi>=w.bhistory.length-1;
  const body=wbody(w.id);body.innerHTML='';body.scrollTop=0;
  s.render(body,w);playDisk();
}

function openVideo(item){

  const cv=$('#vidCv',body),ctx=cv.getContext('2d');
  let playing=true,pos=0,DUR=46,last=performance.now();
  function frame(now){
    if(!cv.isConnected)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(playing)pos+=dt;
    if(pos>=DUR){pos=DUR;playing=false;$('#vidPlay',body).textContent='▶ 播放';say('宣传片播完了。她笑了。那是我最后一次见她笑。',4600)}
    const W=480,H=270;
    if(pos<2){
      ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
      for(let i=0;i<2200;i++){ctx.fillStyle='rgba(255,255,255,'+Math.random()*.5+')';ctx.fillRect(Math.random()*W,Math.random()*H,2,2)}
      ctx.fillStyle='#0f0';ctx.font='16px Courier New';ctx.fillText('LOADING... '+Math.floor(pos*50)+'%',20,140);
    }else{
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#241452');g.addColorStop(1,'#b3276b');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(i*70,0);ctx.lineTo(i*70-60,H);ctx.lineTo(i*70-55,H);ctx.lineTo(i*70+5,0);ctx.fill()}
      const t=pos, bounce=Math.abs(Math.sin(t*3.4))*26;
      ctx.save();ctx.translate(240,190-bounce);
      ctx.fillStyle='#ffd85e';ctx.fillRect(-8,-34,16,16);
      ctx.fillStyle='#27d3ff';ctx.fillRect(-14,-18,28,30);
      ctx.strokeStyle='#ffd85e';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-14,-8);ctx.lineTo(-32,-26);ctx.moveTo(14,-8);ctx.lineTo(34,-30);ctx.stroke();
      ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-8,12);ctx.lineTo(-22,42);ctx.moveTo(8,12);ctx.lineTo(22,42);ctx.stroke();ctx.restore();
      ctx.textAlign='center';ctx.fillStyle='#ffe45e';ctx.font='bold 34px Tahoma';ctx.fillText('PERFECT!',240,66);
      ctx.fillStyle='#fff';ctx.font='bold 18px Tahoma';ctx.fillText('COMBO x 37',240,94);
      if(pos>DUR-6){ctx.fillStyle='#ff3b3b';ctx.font='bold 52px Tahoma';ctx.fillText('MISS',240,150);ctx.fillStyle='#fff';ctx.font='14px SimSun';ctx.fillText('她笑了。那是我最后一次见她笑。',240,180)}
      ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='12px SimSun';ctx.fillText('劲舞团 宣传片 · 2008',14,H-14);
      for(let y=0;y<H;y+=4){ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(0,y,W,2)}
    }
    const tm=Math.floor(pos);
    $('#vidTime',body).textContent=pad(Math.floor(tm/60))+':'+pad(tm%60)+' / 00:46';
    $('#vidTrack',body).firstElementChild.style.width=(pos/DUR*100)+'%';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  $('#vidPlay',body).addEventListener('click',function(){playing=!playing;$('#vidPlay',body).textContent=playing?'⏸ 暂停':'▶ 播放';playTick()});
  $('#vidStop',body).addEventListener('click',function(){pos=0;playing=false;$('#vidPlay',body).textContent='▶ 播放'});
  $('#vidTrack',body).addEventListener('click',function(e){const r=this.getBoundingClientRect();pos=Math.max(0,Math.min(DUR,(e.clientX-r.left)/r.width*DUR))});
}

/* ---------- .mp3 : 8bit 音乐播放器 ---------- */
function openMP3(item){
  const TR=[
    {name:'夜曲 (8bit remix)',bpm:108,notes:[72,74,76,74,72,69,67,69,72,74,76,79,76,74,72,0]},
    {name:'童年 (8bit remix)',bpm:120,notes:[60,64,67,64,62,65,69,65,60,64,67,72,69,67,64,0]},
    {name:'说好的幸福 (8bit remix)',bpm:96,notes:[67,69,71,72,71,69,67,64,65,67,69,67,65,64,62,0]}
  ];
  const id=createWindow({id:'mp3_'+item.id,title:item.name+' - Windows Media Player',icon:'mp3',width:420,height:390,bodyClass:'wmp'});
  const body=wbody(id);
  let cur=(item.meta&&item.meta.track)||0,playing=false,step=0,timer=null;
  body.innerHTML='<div class="wmp-screen" style="flex:0 0 120px"><canvas id="visCv" class="wmp-vis" width="400" height="110"></canvas></div>'+
    '<div class="wmp-ctrl"><div class="wmp-row"><button id="mPlay">▶ 播放</button><button id="mPrev">⏮</button><button id="mNext">⏭</button><span class="wmp-time" id="mTime">00:00</span><div class="wmp-track" id="mTrack"><i></i></div></div>'+
    '<div class="wmp-list">'+TR.map(function(t,i){return '<div data-i="'+i+'" class="'+(i===cur?'on':'')+'">♫ '+t.name+'</div>'}).join('')+'</div>'+
    '<div style="font-size:10px;color:#666">2008年的夏天，你们一人一只耳机。</div></div>';
  const cv=$('#visCv',body),ctx=cv.getContext('2d');
  function drawVis(n){
    ctx.fillStyle='#0b1a2c';ctx.fillRect(0,0,400,110);
    for(let i=0;i<32;i++){
      const h=n>0?(10+Math.random()*(n%12*4+18)):(3+Math.random()*5);
      ctx.fillStyle='hsl('+(190+i*3)+',85%,'+(45+Math.random()*20)+'%)';
      ctx.fillRect(6+i*12,110-h,8,h);
    }
  }
  drawVis(0);
  function tick(){
    if(!cv.isConnected){stop();return}
    const tr=TR[cur],n=tr.notes[step%tr.notes.length];
    if(n>0){
      const f=440*Math.pow(2,(n-69)/12);
      tone(f,0.2,'square',0.055);
      if(step%4===0)tone(f/2,0.3,'triangle',0.05);
      drawVis(n);
    }else drawVis(0);
    step++;
    $('#mTime',body).textContent=pad(Math.floor(step/8/60))+':'+pad(Math.floor(step/8)%60);
    $('#mTrack',body).firstElementChild.style.width=((step%tr.notes.length)/tr.notes.length*100)+'%';
  }
  function play(){
    if(playing)return;ensureAudio();playing=true;$('#mPlay',body).textContent='⏸ 暂停';
    timer=setInterval(tick,60000/TR[cur].bpm/2);
    if(!state.musicHeard){state.musicHeard=true;save();say('那时候你们一人一只耳机，把音量开到最大。',4200)}
  }
  function stop(){playing=false;clearInterval(timer);if($('#mPlay',body))$('#mPlay',body).textContent='▶ 播放';drawVis(0)}
  function select(i){stop();cur=(i+TR.length)%TR.length;step=0;$$('.wmp-list div',body).forEach(function(e){e.classList.toggle('on',+e.dataset.i===cur)});play()}
  $('#mPlay',body).addEventListener('click',function(){playing?stop():play()});
  $('#mPrev',body).addEventListener('click',function(){select(cur-1)});
  $('#mNext',body).addEventListener('click',function(){select(cur+1)});
  $$('.wmp-list div',body).forEach(function(e){e.addEventListener('click',function(){select(+e.dataset.i)})});
  play();
}
